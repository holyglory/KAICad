name: Native delivery
run-name: Native delivery ${{ inputs.source_commit }} (${{ inputs.target }})

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit in this fork (no branch names)
        required: true
        type: string
      target:
        description: Native targets to build
        required: true
        default: all
        type: choice
        options: [all, mac, mac-arm64, mac-x64, windows, windows-cache-check]
      checks_only:
        description: Run only small native delivery fixtures (no KiCad package)
        type: boolean
        default: false
      windows_dependency_cache:
        description: Restore and retain ABI-keyed public Windows dependency archives
        type: boolean
        default: true
      mac_fixture:
        description: With checks_only, select all Mac checks or a focused native fixture
        type: choice
        default: all
        options: [all, caption, handoff, staging, ui-access, concurrency, registry, instance-errors, integrated-update, integrated-mcp-update]
      windows_fixture:
        description: With checks_only, use all fixtures or stage the retained 84359 Windows archive (no publication)
        type: choice
        default: all
        options: [all, package-staging, handoff, caption, harness, registry, json-link, instance-errors, installed-diagnostic, public-feed, integrated-update, integrated-mcp-update]
      mac_update_baseline_commit:
        description: With integrated-update, exact baseline commit with a retained signed envelope for each selected Mac architecture
        type: string
      mac_update_candidate_commit:
        description: With integrated-update, exact different candidate commit currently in the public Mac feed
        type: string
      windows_update_baseline_commit:
        description: With integrated-update, exact Windows baseline commit with a retained signed envelope
        type: string
      windows_update_candidate_commit:
        description: With integrated-update, exact different candidate commit in the public Windows feed
        type: string
      windows_retained_package:
        description: With installed-diagnostic or public-feed, frozen build run/attempt/source commit/archive SHA-256
        type: string
        default: '34555975985/1/433c5e1fdf5954955a19df546236dce78e78b5b0/cd5381d6ebe716c7a63990a0bf3930fec0200a66f6f284e0433f1ea1e8c6dcc6'

# SA-09: disposable public-source builds; no publisher key, engineering
# repository, persistent runner or live editor-control endpoint.
permissions:
  contents: read

jobs:
  mac:
    if: inputs.target == 'all' || startsWith(inputs.target, 'mac')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'mac-arm64' && '[{"runner":"macos-15","architecture":"arm64"}]' || inputs.target == 'mac-x64' && '[{"runner":"macos-15-intel","architecture":"x64"}]' || '[{"runner":"macos-15","architecture":"arm64"},{"runner":"macos-15-intel","architecture":"x64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      DELIVERY_ARCHITECTURE: ${{ matrix.architecture }}
      MAC_BUILDER_COMMIT: 227de1489ae646b2723723bad99f27c10c07c322
      MAC_FIXTURE: ${{ inputs.mac_fixture }}
      CHECKS_ONLY: ${{ inputs.checks_only }}
      MAC_UPDATE_BASELINE_COMMIT: ${{ inputs.mac_update_baseline_commit }}
      MAC_UPDATE_CANDIDATE_COMMIT: ${{ inputs.mac_update_candidate_commit }}
      HOMEBREW_NO_ANALYTICS: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check exact source input
        shell: bash
        run: '[[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: automation/global.json
      - name: Verify pinned ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          if [ -f automation/distribution/upstream.json ]; then
            dotnet run --project automation/tools/KiCad.Automation.Validation --configuration Release -- \
              upstream-verify --repository "$GITHUB_WORKSPACE" --commit "$SOURCE_COMMIT" \
              --output "$RUNNER_TEMP/kicad-upstream-provenance.json"
          else
            git merge-base --is-ancestor f638a860a05b3e48d1074314a656ad9b8f597466 HEAD
          fi
      - name: Check native Mac dependency relocation and failure detection
        working-directory: automation
        shell: bash
        run: |
          export KICAD_HOSTED_FIXTURE_EVIDENCE="$RUNNER_TEMP/kicad-loader-preflight/evidence"
          kicad_mac_test_filter='FullyQualifiedName~MacRuntimePathTests|FullyQualifiedName~MacArchivePreflightTests|FullyQualifiedName~MacUpdateStagerTests|FullyQualifiedName~MacVerifiedInstallationTests|FullyQualifiedName~PosixUpdateActivationTests|FullyQualifiedName~MacProcessIdentityTests|FullyQualifiedName~MacUpdateHandoffTests|FullyQualifiedName~MacCaptionActionTests|FullyQualifiedName~UpdateStoreLeaseTests|FullyQualifiedName~UpdateRegistrationRetryTests|FullyQualifiedName~MacUpdatePairTests'
          if [ "$CHECKS_ONLY" = true ] && [ "$MAC_FIXTURE" = caption ]; then
            kicad_mac_test_filter='FullyQualifiedName~MacCaptionActionTests'
          fi
          if [ "$CHECKS_ONLY" = true ] && [ "$MAC_FIXTURE" = handoff ]; then
            kicad_mac_test_filter='FullyQualifiedName~MacProcessIdentityTests|FullyQualifiedName~MacUpdateHandoffTests'
          fi
          if [ "$CHECKS_ONLY" = true ] && [ "$MAC_FIXTURE" = staging ]; then
            kicad_mac_test_filter='FullyQualifiedName~MacUpdateStagerTests|FullyQualifiedName~NngBindingLifetimeTests'
          fi
          if [ "$CHECKS_ONLY" = true ] && [ "$MAC_FIXTURE" = ui-access ]; then
            kicad_mac_test_filter='FullyQualifiedName~MacUiDriverTests'
          fi
          if [ "$CHECKS_ONLY" = true ] && [ "$MAC_FIXTURE" = concurrency ]; then
            kicad_mac_test_filter='FullyQualifiedName~UpdateStoreLeaseTests|FullyQualifiedName~UpdateRegistrationRetryTests|FullyQualifiedName~MacCaptionActionTests|FullyQualifiedName~MacUiDriverTests|FullyQualifiedName~MacVerifiedInstallationTests'
          fi
          if [ "$CHECKS_ONLY" = true ] && [ "$MAC_FIXTURE" = registry ]; then
            kicad_mac_test_filter='FullyQualifiedName~InstanceReplacementTests|FullyQualifiedName~InstanceUpdateReconnectionTests|FullyQualifiedName~UpdateOriginTests|FullyQualifiedName~InstanceRegistryTests.PlatformLocalLaunchReceiptUsesTheSameEndpointAsNativeStartup'
          fi
          if [ "$MAC_FIXTURE" = instance-errors ]; then
            test "$CHECKS_ONLY" = true
            kicad_mac_test_filter='FullyQualifiedName~InstanceToolBoundaryTests|FullyQualifiedName~InstanceRegistryTests|FullyQualifiedName~McpProcessTests'
          fi
          if [ "$MAC_FIXTURE" = integrated-update ] || [ "$MAC_FIXTURE" = integrated-mcp-update ]; then
            test "$CHECKS_ONLY" = true
            # Prove the native action driver before downloading/installing the
            # frozen KiCad pair. A failed control fixture gates the costly journey.
            dotnet test KiCad.Automation.slnx --configuration Release \
              --filter 'FullyQualifiedName~MacUiDriverTests|FullyQualifiedName~NativeCaptionMcpProbeTests' --logger trx \
              --results-directory "$RUNNER_TEMP/kicad-loader-preflight/driver"
            [[ "$MAC_UPDATE_BASELINE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [[ "$MAC_UPDATE_CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            test "$MAC_UPDATE_BASELINE_COMMIT" != "$MAC_UPDATE_CANDIDATE_COMMIT"
            export KICAD_MAC_UI_DOWNLOAD_BASELINE=true
            export KICAD_MAC_UI_BASELINE_COMMIT="$MAC_UPDATE_BASELINE_COMMIT"
            export KICAD_MAC_UI_BASELINE_ENVELOPE="$GITHUB_WORKSPACE/automation/distribution/releases/baseline-osx-$DELIVERY_ARCHITECTURE-$MAC_UPDATE_BASELINE_COMMIT.signed.json"
            test -f "$KICAD_MAC_UI_BASELINE_ENVELOPE"
            export KICAD_MAC_UI_PUBLISHER_SPKI="$GITHUB_WORKSPACE/automation/distribution/preview-publisher.spki"
            export KICAD_MAC_UI_EXPECTED_COMMIT="$MAC_UPDATE_CANDIDATE_COMMIT"
            export KICAD_MAC_UI_ORIGIN="https://kicad.vr.ae/platforms/osx-$DELIVERY_ARCHITECTURE/"
            kicad_mac_test_filter='TestCategory=NativeMacIntegratedUpdate'
            if [ "$MAC_FIXTURE" = integrated-mcp-update ]; then
              kicad_mac_test_filter='TestCategory=NativeMacIntegratedMcpUpdate'
            fi
          fi
          dotnet test KiCad.Automation.slnx --configuration Release \
            --filter "$kicad_mac_test_filter" --logger trx \
            --results-directory "$RUNNER_TEMP/kicad-loader-preflight"
      - name: Prepare official Mac dependencies and validate the candidate
        if: '!inputs.checks_only'
        working-directory: automation
        shell: bash
        run: |
          dotnet run --project tools/KiCad.Automation.Validation --configuration Release -- \
            hosted --repository "$GITHUB_WORKSPACE" --commit "$SOURCE_COMMIT" \
            --architecture "$DELIVERY_ARCHITECTURE" --output "$RUNNER_TEMP/kicad-delivery" \
            --dependency-commit "$MAC_BUILDER_COMMIT"
      - name: Retain native result and bounded build evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-macos-${{ matrix.architecture }}-${{ inputs.source_commit }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kicad-delivery/evidence
            ${{ runner.temp }}/kicad-loader-preflight
            ${{ runner.temp }}/kicad-delivery/receipt.json
            ${{ runner.temp }}/kicad-delivery/packages
            ${{ runner.temp }}/kicad-delivery/diagnostics
            ${{ runner.temp }}/kicad-delivery/mac/evidence
            ${{ runner.temp }}/kicad-delivery/mac/result.json
            ${{ runner.temp }}/kicad-delivery/mac/evidence.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  windows:
    if: inputs.target == 'all' || inputs.target == 'windows'
    permissions:
      contents: read
      # SA-09: read this public fork's retained build; never upload a signing key.
      actions: read
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      VCPKG_COMMIT: 66c0373dc7fca549e5803087b9487edfe3aca0a1
      # KiCad's documented, public read-only binary feed. ABI misses still build
      # from the pinned manifest/registries; no packages are pushed to GitLab.
      VCPKG_BINARY_SOURCES: clear;default,readwrite;nuget,https://gitlab.com/api/v4/projects/27426693/packages/nuget/index.json,read
      VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/kicad-vcpkg-binary-cache
      CHECKS_ONLY: ${{ inputs.checks_only }}
      WINDOWS_FIXTURE: ${{ inputs.windows_fixture }}
      WINDOWS_UPDATE_BASELINE_COMMIT: ${{ inputs.windows_update_baseline_commit }}
      WINDOWS_UPDATE_CANDIDATE_COMMIT: ${{ inputs.windows_update_candidate_commit }}
      KICAD_RETAINED_WINDOWS_INPUT: ${{ inputs.windows_retained_package }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check exact source input
        shell: pwsh
        run: |
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'An exact lower-case commit is required.' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify pinned ancestry and select installed MSVC
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:SOURCE_COMMIT) { throw 'Wrong source commit.' }
          $upstreamBase = 'f638a860a05b3e48d1074314a656ad9b8f597466'
          if (Test-Path automation/distribution/upstream.json) {
            $upstreamBase = (Get-Content automation/distribution/upstream.json -Raw | ConvertFrom-Json).commit
          }
          if ($upstreamBase -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid upstream commit.' }
          git merge-base --is-ancestor $upstreamBase HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned ancestry is missing.' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'The runner is missing MSVC x64.' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsRedistDir', 'VSINSTALLDIR')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" >> $env:GITHUB_ENV }
          }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: automation/global.json
      - name: Verify two real Windows designs through the signed caption update
        if: inputs.windows_fixture == 'integrated-update' || inputs.windows_fixture == 'integrated-mcp-update'
        timeout-minutes: 30
        working-directory: automation
        shell: pwsh
        run: |
          if ($env:CHECKS_ONLY -ne 'true') { throw 'Integrated update is a checks-only fixture.' }
          foreach ($commit in @($env:WINDOWS_UPDATE_BASELINE_COMMIT, $env:WINDOWS_UPDATE_CANDIDATE_COMMIT)) {
            if ($commit -cnotmatch '^[0-9a-f]{40}$') { throw 'An exact frozen Windows package commit is required.' }
          }
          if ($env:WINDOWS_UPDATE_BASELINE_COMMIT -eq $env:WINDOWS_UPDATE_CANDIDATE_COMMIT) { throw 'The source build must change.' }
          $env:KICAD_WINDOWS_UI_BASELINE_COMMIT = $env:WINDOWS_UPDATE_BASELINE_COMMIT
          $env:KICAD_WINDOWS_UI_EXPECTED_COMMIT = $env:WINDOWS_UPDATE_CANDIDATE_COMMIT
          $env:KICAD_WINDOWS_UI_BASELINE_ENVELOPE = "$env:GITHUB_WORKSPACE/automation/distribution/releases/baseline-win-x64-$env:WINDOWS_UPDATE_BASELINE_COMMIT.signed.json"
          if (!(Test-Path $env:KICAD_WINDOWS_UI_BASELINE_ENVELOPE)) { throw 'Retained public baseline envelope is unavailable.' }
          $env:KICAD_WINDOWS_UI_PUBLISHER_SPKI = "$env:GITHUB_WORKSPACE/automation/distribution/preview-publisher.spki"
          $env:KICAD_WINDOWS_UI_ORIGIN = 'https://kicad.vr.ae/platforms/win-x64/'
          $env:KICAD_HOSTED_FIXTURE_EVIDENCE = "$env:RUNNER_TEMP/kicad-windows-preflight/evidence"
          dotnet test KiCad.Automation.slnx --configuration Release `
            --filter 'FullyQualifiedName~WindowsCaptionActionTests|FullyQualifiedName~WindowsUiDriverTests|FullyQualifiedName~WindowsNativeLogTests' `
            --logger trx --results-directory "$env:RUNNER_TEMP/kicad-windows-preflight/driver"
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows UI preflight failed.' }
          $kicad_pair_filter = 'TestCategory=NativeWindowsIntegratedUpdate'
          if ($env:WINDOWS_FIXTURE -eq 'integrated-mcp-update') { $kicad_pair_filter = 'TestCategory=NativeWindowsIntegratedMcpUpdate' }
          dotnet test KiCad.Automation.slnx --configuration Release --no-build `
            --filter $kicad_pair_filter `
            --logger trx --results-directory "$env:RUNNER_TEMP/kicad-windows-preflight"
          if ($LASTEXITCODE -ne 0) { throw 'The actual Windows update journey failed.' }
      - name: Check Windows delivery contracts and select supported stages
        if: inputs.windows_fixture == 'all' || inputs.windows_fixture == 'caption' || inputs.windows_fixture == 'harness' || inputs.windows_fixture == 'registry' || inputs.windows_fixture == 'json-link' || inputs.windows_fixture == 'instance-errors'
        id: stages
        timeout-minutes: 10
        working-directory: automation
        shell: pwsh
        run: |
          $env:KICAD_HOSTED_FIXTURE_EVIDENCE = "$env:RUNNER_TEMP/kicad-windows-preflight/evidence"
          if ($env:WINDOWS_FIXTURE -eq 'instance-errors') {
            if ($env:CHECKS_ONLY -ne 'true') { throw 'Instance error verification is a checks-only fixture.' }
            dotnet test KiCad.Automation.slnx --configuration Release `
              --filter 'FullyQualifiedName~InstanceToolBoundaryTests|FullyQualifiedName~InstanceRegistryTests|FullyQualifiedName~McpProcessTests' `
              --logger trx --results-directory "$env:RUNNER_TEMP/kicad-windows-preflight"
            if ($LASTEXITCODE -ne 0) { throw 'Native instance error contract failed.' }
            exit 0
          }
          if ($env:WINDOWS_FIXTURE -eq 'json-link') {
            if ($env:CHECKS_ONLY -ne 'true') { throw 'JSON link verification is a checks-only fixture.' }
            dotnet test KiCad.Automation.slnx --configuration Release `
              --filter 'FullyQualifiedName~WindowsJsonLinkTests|FullyQualifiedName~WindowsNativeRestartRequestTests' `
              --logger trx --results-directory "$env:RUNNER_TEMP/kicad-windows-preflight"
            if ($LASTEXITCODE -ne 0) { throw 'Windows production JSON DLL boundary failed.' }
            exit 0
          }
          if ($env:WINDOWS_FIXTURE -eq 'registry') {
            if ($env:CHECKS_ONLY -ne 'true') { throw 'Registry verification is a checks-only fixture.' }
            dotnet test KiCad.Automation.slnx --configuration Release `
              --filter 'FullyQualifiedName~InstanceReplacementTests|FullyQualifiedName~InstanceUpdateReconnectionTests|FullyQualifiedName~UpdateOriginTests|FullyQualifiedName~InstanceRegistryTests.PlatformLocalLaunchReceiptUsesTheSameEndpointAsNativeStartup|FullyQualifiedName~NativeCaptionMcpProbeTests' `
              --logger trx --results-directory "$env:RUNNER_TEMP/kicad-windows-preflight"
            if ($LASTEXITCODE -ne 0) { throw 'Windows registry fixture failed.' }
            exit 0
          }
          if ($env:WINDOWS_FIXTURE -eq 'harness') {
            if ($env:CHECKS_ONLY -ne 'true') { throw 'Harness verification is a checks-only fixture.' }
            dotnet test KiCad.Automation.slnx --configuration Release `
              --filter 'FullyQualifiedName~WindowsInstalledHarnessTests|FullyQualifiedName~WindowsFixtureCleanupTests|FullyQualifiedName~McpToolPayloadTests|FullyQualifiedName~WindowsDiagnosticPackageTests|FullyQualifiedName~HostedDeliveryTests|FullyQualifiedName~HostedPreviewStagingTests|FullyQualifiedName~UpdateCheckerTests|FullyQualifiedName~UpdateStoreLeaseTests' `
              --logger trx --results-directory "$env:RUNNER_TEMP/kicad-windows-preflight"
            if ($LASTEXITCODE -ne 0) { throw 'Windows harness fixture failed.' }
            exit 0
          }
          if ($env:WINDOWS_FIXTURE -eq 'caption') {
            if ($env:CHECKS_ONLY -ne 'true') { throw 'Caption component verification is a checks-only fixture.' }
            dotnet test KiCad.Automation.slnx --configuration Release `
              --filter 'FullyQualifiedName~WindowsCaptionActionTests|FullyQualifiedName~WindowsUiDriverTests' `
              --logger trx --results-directory "$env:RUNNER_TEMP/kicad-windows-preflight"
            if ($LASTEXITCODE -ne 0) { throw 'Windows caption fixture failed.' }
            exit 0
          }
          dotnet test KiCad.Automation.slnx --configuration Release `
            --filter 'FullyQualifiedName~HostedDeliveryTests|FullyQualifiedName~HostedWindowsCheckpointTests|FullyQualifiedName~WindowsJsonLinkTests|FullyQualifiedName~NativeIpcEndpointTests|FullyQualifiedName~WindowsUiDriverTests|FullyQualifiedName~WindowsArchivePreflightTests|FullyQualifiedName~WindowsUpdateStagerTests|FullyQualifiedName~WindowsVersionSelectionTests|FullyQualifiedName~UpdateCommandTests|FullyQualifiedName~WindowsFixtureCleanupTests|FullyQualifiedName~WindowsVerifiedVersionsTests|FullyQualifiedName~WindowsLauncherTests|FullyQualifiedName~WindowsInstallerTests|FullyQualifiedName~WindowsProcessIdentityTests|FullyQualifiedName~WindowsUpdateHandoffTests|FullyQualifiedName~WindowsUpdateInspectionTests|FullyQualifiedName~WindowsRestartCommandTests|FullyQualifiedName~WindowsNativeRestartRequestTests|FullyQualifiedName~UpdateStoreLeaseTests|FullyQualifiedName~UpdateCheckerTests|FullyQualifiedName~UpdateRegistrationRetryTests|FullyQualifiedName~WindowsInstalledHarnessTests|FullyQualifiedName~WindowsDiagnosticPackageTests|FullyQualifiedName~WindowsCaptionActionTests' `
            --logger trx --results-directory "$env:RUNNER_TEMP/kicad-windows-preflight"
          if ($LASTEXITCODE -ne 0) { throw 'Windows delivery preflight failed.' }
          $split = Test-Path 'tools/KiCad.Automation.Validation/HostedWindowsCheckpoint.cs'
          "split=$($split.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Check the installed Windows helper against its real public feed
        if: inputs.windows_fixture == 'public-feed'
        timeout-minutes: 20
        working-directory: automation
        shell: pwsh
        run: |
          if ($env:CHECKS_ONLY -ne 'true') { throw 'Public feed verification is checks-only.' }
          $env:KICAD_HOSTED_FIXTURE_EVIDENCE = "$env:RUNNER_TEMP/kicad-windows-preflight/evidence"
          $env:KICAD_WINDOWS_PUBLIC_PUBLISHER = "$env:GITHUB_WORKSPACE/automation/distribution/preview-publisher.spki"
          dotnet test KiCad.Automation.slnx --configuration Release `
            --filter 'TestCategory=NativeWindowsPublicFeed' --logger trx `
            --results-directory "$env:RUNNER_TEMP/kicad-windows-preflight/public-feed"
          if ($LASTEXITCODE -ne 0) { throw 'The installed Windows helper did not verify its public feed.' }
      - name: Operate the retained corrected Windows application without a rebuild
        if: inputs.windows_fixture == 'installed-diagnostic'
        timeout-minutes: 30
        working-directory: automation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:CHECKS_ONLY -ne 'true') { throw 'Retained package operation is checks-only.' }
          if ($env:KICAD_RETAINED_WINDOWS_INPUT -cnotmatch '\A[1-9][0-9]{0,19}/[1-9][0-9]{0,5}/[0-9a-f]{40}/[0-9a-f]{64}\z') {
            throw 'Require the exact build run/attempt/source commit/archive SHA-256.'
          }
          $retained = $env:KICAD_RETAINED_WINDOWS_INPUT.Split('/')
          $env:KICAD_HOSTED_FIXTURE_EVIDENCE = "$env:RUNNER_TEMP/kicad-windows-preflight/evidence"
          dotnet test KiCad.Automation.slnx --configuration Release `
            --filter 'FullyQualifiedName~WindowsInstalledHarnessTests|FullyQualifiedName~WindowsFixtureCleanupTests|FullyQualifiedName~McpToolPayloadTests|FullyQualifiedName~WindowsRetainedPackageInputTests' `
            --logger trx --results-directory "$env:RUNNER_TEMP/kicad-windows-preflight/harness"
          if ($LASTEXITCODE -ne 0) { throw 'Native harness preflight failed.' }
          gh run download $retained[0] --repo "${{ github.repository }}" `
            --name "native-windows-x64-$($retained[2])-$($retained[1])" `
            --dir "$env:RUNNER_TEMP/kicad-retained-application"
          if ($LASTEXITCODE -ne 0) { throw 'Retained Windows artifact unavailable.' }
          $env:KICAD_RETAINED_WINDOWS_ARCHIVE = "$env:RUNNER_TEMP/kicad-retained-application/kicad-delivery/diagnostics/unqualified-windows-$($retained[2]).zip"
          $env:KICAD_RETAINED_WINDOWS_RECEIPT = "$env:RUNNER_TEMP/kicad-retained-application/kicad-delivery/receipt.json"
          dotnet test KiCad.Automation.slnx --configuration Release --no-build `
            --filter 'TestCategory=NativeWindowsRetainedPackage' --logger trx `
            --results-directory "$env:RUNNER_TEMP/kicad-windows-preflight/retained"
          if ($LASTEXITCODE -ne 0) { throw 'Actual retained Windows editor journey failed.' }
      - name: Stage and verify the exact retained Windows archive
        if: inputs.windows_fixture == 'package-staging' || inputs.windows_fixture == 'handoff'
        working-directory: automation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:CHECKS_ONLY -ne 'true') { throw 'Package staging is a checks-only fixture.' }
          gh run download 34487042181 --repo "${{ github.repository }}" `
            --name native-windows-x64-84359da19e3b168290b6199dc36077edbf03faf5-1 `
            --dir "$env:RUNNER_TEMP/kicad-staging-archive"
          if ($LASTEXITCODE -ne 0) { throw 'The retained Windows build artifact could not be downloaded.' }
          $env:KICAD_TEST_WINDOWS_ARCHIVE = "$env:RUNNER_TEMP/kicad-staging-archive/kicad-delivery/packages/kicad-codex-84359da19e3b168290b6199dc36077edbf03faf5-windows-x64.zip"
          $env:KICAD_TEST_WINDOWS_ARCHIVE_COMMIT = '84359da19e3b168290b6199dc36077edbf03faf5'
          $env:KICAD_TEST_WINDOWS_ARCHIVE_SHA256 = '486557b4de48cb2baf7809e1c9411440c7eb0e6613d7d35adbdeb984db1ec655'
          $env:KICAD_HOSTED_FIXTURE_EVIDENCE = "$env:RUNNER_TEMP/kicad-windows-preflight/evidence"
          $kicad_package_filter = 'TestCategory=WindowsArchivePayload|TestCategory=NativeWindowsPackageStaging'
          if ($env:WINDOWS_FIXTURE -eq 'handoff') { $kicad_package_filter = 'TestCategory=NativeWindowsHandoff' }
          dotnet test KiCad.Automation.slnx --configuration Release `
            --filter $kicad_package_filter `
            --logger trx --results-directory "$env:RUNNER_TEMP/kicad-windows-preflight"
          if ($LASTEXITCODE -ne 0) { throw 'The actual Windows package staging fixture failed.' }
      - name: Identify the Windows dependency cache
        if: '!inputs.checks_only'
        id: dependency-cache-key
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $compiler = (Get-Item (Get-Command cl.exe).Source).VersionInfo.FileVersion
          if (!$compiler) { throw 'MSVC version is required for the dependency cache family.' }
          $compiler = $compiler -replace '[^0-9A-Za-z._-]', '_'
          $family = "kicad-vcpkg-v1-windows2022-x64-$env:VCPKG_COMMIT-$compiler"
          "family=$family" >> $env:GITHUB_OUTPUT
          "key=$family-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tools/custom_vcpkg_triplets/**') }}" >> $env:GITHUB_OUTPUT
      - name: Restore compiled Windows dependencies
        if: steps.dependency-cache-key.outcome == 'success' && inputs.windows_dependency_cache
        id: dependency-cache
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/kicad-vcpkg-binary-cache
          key: ${{ steps.dependency-cache-key.outputs.key }}
          restore-keys: ${{ steps.dependency-cache-key.outputs.family }}-
          enableCrossOsArchive: false
      - name: Prepare Windows dependencies and native build configuration
        if: steps.stages.outputs.split == 'true' && !inputs.checks_only
        id: prepare
        working-directory: automation
        shell: pwsh
        run: |
          dotnet run --project tools/KiCad.Automation.Validation --configuration Release -- `
            hosted --repository "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" `
            --architecture x64 --output "$env:RUNNER_TEMP/kicad-delivery" `
            --dependency-commit "$env:VCPKG_COMMIT" --phase prepare
          if ($LASTEXITCODE -ne 0) { throw 'Windows preparation failed; see retained evidence.' }
      - name: Retain compiled Windows dependencies before native tests
        if: success() && steps.prepare.outcome == 'success' && inputs.windows_dependency_cache && steps.dependency-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/kicad-vcpkg-binary-cache
          key: ${{ steps.dependency-cache-key.outputs.key }}
      - name: Retain preparation evidence before native compilation
        if: always() && steps.stages.outputs.split == 'true' && !inputs.checks_only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preparation-${{ inputs.source_commit }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kicad-delivery/evidence
            ${{ runner.temp }}/kicad-delivery/windows-prepared.json
            ${{ runner.temp }}/kicad-delivery/receipt.json
            ${{ runner.temp }}/kicad-windows-preflight
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

  windows-cache-seed:
    if: inputs.target == 'windows-cache-check'
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.compile.outputs.sha256 }}
    steps:
      - name: Check exact fixture source
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'An exact source commit is required.' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Compile and execute the native fixture
        id: compile
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC is unavailable.' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $cache = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/kicad-native-cache-probe"
          $scratch = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/kicad-cache-seed-output"
          $binary = Join-Path $cache.FullName 'file-mode.exe'
          & cl.exe /nologo /std:c++20 /EHsc /MD /O2 "/I$env:GITHUB_WORKSPACE/libs/kiplatform/os/windows" "$env:GITHUB_WORKSPACE/automation/tests/fixtures/windows-file-mode/probe.cpp" "/Fe$binary" "/Fo$env:RUNNER_TEMP/file-mode.obj"
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture compilation failed.' }
          & $binary $scratch.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Cold native fixture execution failed.' }
          $hash = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - name: Save compiled fixture through the official cache backend
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/kicad-native-cache-probe
          key: kicad-cache-transfer-v1-${{ github.run_id }}-${{ github.run_attempt }}
  windows-cache-restore:
    if: inputs.target == 'windows-cache-check'
    needs: windows-cache-seed
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Restore on a fresh runner
        id: restore
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/kicad-native-cache-probe
          key: kicad-cache-transfer-v1-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
          enableCrossOsArchive: false
      - name: Verify and execute without recompilation
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.windows-cache-seed.outputs.sha256 }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          if ($env:CACHE_HIT -ne 'true') { throw 'The exact cache was not restored.' }
          $binary = "$env:RUNNER_TEMP/kicad-native-cache-probe/file-mode.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          if ($hash -cne $env:EXPECTED_SHA256) { throw 'Restored bytes differ from the compiled fixture.' }
          $scratch = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/kicad-cache-restored-output"
          & $binary $scratch.FullName
          if ($LASTEXITCODE -ne 0) { throw 'The restored native fixture failed.' }
          @{schemaVersion=1; actualCacheTransfer=$true; cacheHit=$true; sha256=$hash; rebuilt=$false; fullVcpkgSpeedupMeasured=$false} | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/windows-cache-transfer.json"
      - name: Retain the transfer receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-cache-transfer-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/windows-cache-transfer.json
          if-no-files-found: error
          retention-days: 14
      - name: Build, inspect and package Windows x64
        if: success() && !inputs.checks_only
        working-directory: automation
        shell: pwsh
        run: |
          # Older exact source commits retain their original all-in-one command.
          $phaseArguments = @()
          if ('${{ steps.stages.outputs.split }}' -eq 'true') { $phaseArguments = @('--phase', 'build') }
          dotnet run --project tools/KiCad.Automation.Validation --configuration Release -- `
            hosted --repository "$env:GITHUB_WORKSPACE" --commit "$env:SOURCE_COMMIT" `
            --architecture x64 --output "$env:RUNNER_TEMP/kicad-delivery" `
            --dependency-commit "$env:VCPKG_COMMIT" @phaseArguments
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows delivery failed; see retained evidence.' }
      - name: Retain native result and bounded build evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-x64-${{ inputs.source_commit }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kicad-delivery/evidence
            ${{ runner.temp }}/kicad-delivery/receipt.json
            ${{ runner.temp }}/kicad-delivery/packages
            ${{ runner.temp }}/kicad-delivery/windows-prepared.json
            ${{ runner.temp }}/kicad-delivery/windows-build-started.json
            ${{ runner.temp }}/kicad-delivery/diagnostics
            ${{ runner.temp }}/kicad-windows-preflight
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
