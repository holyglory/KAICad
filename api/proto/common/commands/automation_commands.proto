  string operation_id = 1;
  bool found = 2;
  string operation = 3;
  kiapi.common.types.DocumentSpecifier document = 4;
  bool completed = 5;
  // ImportNetlistResponse fields for netlist-import operations. Zone-refill
  // operations leave these fields at zero/empty because the native command
  // returns Empty. Direct fields avoid requiring board-command descriptors in
  // the shared automation Any registry.
  uint32 error_count = 6;
  uint32 warning_count = 7;
  uint32 new_footprint_count = 8;
  string report = 9;
  bool terminal = 400;
  NativeZoneFillOutcome zone_fill_outcome = 401;
  NativeZoneFillOutcome primary_fill_outcome = 402;
  NativeZoneFillOutcome generator_refill_outcome = 403;
  bool generator_refill_required = 404;
  bool primary_commit_applied = 405;
  bool generator_refill_commit_applied = 406;
  bool rollback_completed = 407;
  string failure_stage = 408;
  string error_code = 409;
  string error_message = 410;
  string process_epoch = 411;
  bool commit_state_known = 412;
}

