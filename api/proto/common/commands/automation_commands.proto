  string table_scope = 7;
  string nickname = 8;
  string raw_uri = 9;
  string expanded_uri = 10;
  string provider = 11;
  string provider_options = 12;
  string detached_definition_sha256 = 13;
  uint64 detached_definition_bytes = 14;
  repeated NativeCapabilityLibrarySnapshotDependencyBaseline dependency_baselines = 15;
  bool forced_refresh = 16;
  bool provider_observable = 17;
  bool content_snapshot_complete = 18;
  bool disk_baseline_checked = 19;
  bool complete_change_tracking = 20;
  bool postverify = 21;
  NativeCapabilitySymbolLibraryCheckedState checked_state = 22;
  NativeCapabilityFootprintLibraryCheckedState footprint_checked_state = 23;
}

