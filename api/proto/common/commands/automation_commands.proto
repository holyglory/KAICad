/*
 * KiCad automation extensions. GPL-3.0-or-later.
 * These messages are shared by the native server and compiled MCP client.
 */
syntax = "proto3";
package kiapi.automation.v1;
option csharp_namespace = "KiCad.Automation.Protocol";
import "common/types/base_types.proto";
import "common/types/embedded_files.proto";
import "google/protobuf/any.proto";
import "schematic/schematic_types.proto";
import "board/board_rules.proto";
import "board/board_types.proto";

// Shared Phase 2 seam. Lanes add fields and values only between their own
// "-- lane" markers, numbered inside their band (2A 100-199, 2B 200-299,
// 2C 300-399, 2D 400-499), and new messages only inside their "== lane"
// block at the end of this file. SharedProtoBandTests enforces this.

message ReadPcbDrcState {
  kiapi.common.types.DocumentSpecifier document = 1;
}

// Native derived comparison input, NOT the editable engineering XML or a
// schematic reconstruction payload. Kept undiscoverable until capture is qualified.
message ReadSchematicParityNetlist {
  kiapi.common.types.DocumentSpecifier document = 1;
  DocumentLifecycleState expected_state = 2;
  uint32 schema_version = 3;
  bool allow_duplicate_sheet_names = 4;
}

message SchematicParityNetlistSnapshot {
  uint32 schema_version = 1;
  DocumentLifecycleState source_state = 2;
  string native_netlist_sexpr = 3;
  string netlist_sha256 = 4;
  repeated string warnings = 5;
}

message PcbDrcFinding {
  string native_id = 1;
  kiapi.board.DrcMarker marker = 2;
  bool excluded = 3;
  string comment = 4;
}

// Existing native marker inventory, not an assertion of fresh verification.
message PcbDrcState {
  kiapi.common.types.DocumentSpecifier document = 1;
  DocumentRevision revision = 2;
  string process_epoch = 3;
  bool running = 4;
  bool marker_snapshot_complete = 5;
  bool results_freshness_known = 6;
  repeated PcbDrcFinding findings = 7;
}

// Live PCB DRC job control. These messages are intentionally not registered
// as MCP tools until the native job owner and cancellation path are present.
message StartPcbDrcJob {
  kiapi.common.types.DocumentSpecifier document = 1;
  string operation_id = 2;
  bool refill_zones = 3;
  bool report_all_track_errors = 4;
  bool test_footprints = 5;
  DocumentRevision expected_revision = 6;
  string process_epoch = 7;
  // Required for test_footprints. Captured natively from this explicit schematic
  // state; clients do not supply their own substitute netlist.
  DocumentLifecycleState expected_schematic_state = 8;
  bool allow_duplicate_sheet_names = 9;
  // Optional guide-derived copper candidates. Native DRC applies these only to
  // its detached snapshot; the live board is never mutated by a dry run.
  repeated google.protobuf.Any candidate_items = 10;
}

message ReadPcbDrcJob {
  kiapi.common.types.DocumentSpecifier document = 1;
  string job_id = 2;
  string process_epoch = 3;
}

message CancelPcbDrcJob {
  kiapi.common.types.DocumentSpecifier document = 1;
  string job_id = 2;
  string process_epoch = 3;
}

// Native KiCad simulator jobs. The eeschema owner uses its existing
// SPICE_SIMULATOR/ngspice integration; MCP only addresses the job.
message StartSimulationJob {
  kiapi.common.types.DocumentSpecifier document = 1;
  string operation_id = 2;
  string process_epoch = 3;
  string netlist = 4;
}
message ReadSimulationJob {
  kiapi.common.types.DocumentSpecifier document = 1;
  string job_id = 2;
  string process_epoch = 3;
}
message CancelSimulationJob {
  kiapi.common.types.DocumentSpecifier document = 1;
  string job_id = 2;
  string process_epoch = 3;
}
enum SimulationJobStatus {
  SIMJS_UNKNOWN = 0;
  SIMJS_RUNNING = 1;
  SIMJS_COMPLETED = 2;
  SIMJS_CANCELLED = 3;
  SIMJS_FAILED = 4;
}
message SimulationVector {
  string name = 1;
  repeated double values = 2;
  bool complex = 3;
}
message SimulationJobState {
  kiapi.common.types.DocumentSpecifier document = 1;
  string job_id = 2;
  string operation_id = 3;
  string process_epoch = 4;
  SimulationJobStatus status = 5;
  uint64 sequence = 6;
  double progress = 7;
  string error_code = 8;
  string error_message = 9;
  bool cancellation_requested = 10;
  bool worker_finished = 11;
  repeated string messages = 12;
  repeated SimulationVector vectors = 13;
}

enum PcbDrcJobStatus {
  PDRCJS_UNKNOWN = 0;
  PDRCJS_QUEUED = 1;
  PDRCJS_RUNNING = 2;
  PDRCJS_COMPLETED = 3;
  PDRCJS_CANCELLED = 4;
  PDRCJS_FAILED = 5;
  PDRCJS_STALE = 6;
  PDRCJS_INCOMPLETE = 7;
}

message PcbDrcJobState {
  kiapi.common.types.DocumentSpecifier document = 1;
  string job_id = 2;
  string operation_id = 3;
  DocumentRevision checked_revision = 4;
  string process_epoch = 5;
  PcbDrcJobStatus status = 6;
  double progress = 7;
  string phase = 8;
  string error_code = 9;
  string error_message = 10;
  bool results_fresh = 11;
  repeated PcbDrcFinding findings = 12;
  // A request to stop is not a terminal cancellation receipt.
  bool cancellation_requested = 13;
  bool worker_finished = 14;
  // False until all declared project/rule dependencies are captured exactly.
  bool snapshot_complete = 15;
  DocumentLifecycleState checked_schematic_state = 16;
  repeated string input_warnings = 17;
  bool candidate_dry_run = 18;
  repeated string candidate_item_ids = 19;
}

// Read-only native PNS route preview. The router operates on its in-memory
// branch and returns typed candidates; no live board commit is performed.
message StartPcbRoutePreview {
  kiapi.common.types.DocumentSpecifier document = 1;
  string operation_id = 2;
  string process_epoch = 3;
  DocumentRevision expected_revision = 4;
  string start_item_id = 5;
  kiapi.common.types.Vector2 start = 6;
  repeated kiapi.common.types.Vector2 waypoints = 7;
  kiapi.board.types.BoardLayer layer = 8;
  bool force_finish = 9;
}

message PcbRoutePreviewState {
  kiapi.common.types.DocumentSpecifier document = 1;
  string operation_id = 2;
  DocumentRevision checked_revision = 3;
  string process_epoch = 4;
  bool completed = 5;
  string error_code = 6;
  string error_message = 7;
  repeated google.protobuf.Any route_items = 8;
  bool preview_only = 9;
  bool native_commit = 10;
}

message ReadSchematicMetadata {
  kiapi.common.types.DocumentSpecifier document = 1;
  // 0/1: legacy fields with explicit missing-ERC coverage; 2: includes ERC;
  // 3: also includes the net-chain class registry and assignments.
  // 4: includes explicit net-chain member exclusions.
  // 5: includes persisted reference-numbering policy.
  // 6: includes the inventory of previously allocated reference designators.
  // 7: includes project field templates and symbol/library comparison policy.
  // Unknown versions are rejected, never silently simplified.
  uint32 schema_version = 2;
}

// Native in-memory save flags, not a filesystem comparison or complete project
// persistence audit. Querying never saves, navigates or reloads the editor.
message ReadSchematicSaveState {
  kiapi.common.types.DocumentSpecifier document = 1;
}

// Read-only full native-writer state observation. Not yet a lifecycle mutation
// token: callers must honor the explicit change/disk coverage below.
message ReadDocumentLifecycleState {
  kiapi.common.types.DocumentSpecifier document = 1;
}

enum DocumentLifecycleScope {
  DLS_UNKNOWN = 0;
  DLS_SCHEMATIC_HIERARCHY = 1;
  DLS_PCB = 2;
}

enum NativeFileBaselineStatus {
  NFBS_UNKNOWN = 0;
  NFBS_UNCHANGED = 1;
  NFBS_CHANGED = 2;
  NFBS_WRONG_PATH = 3;
  NFBS_UNREADABLE = 4;
}

// Read-only comparison with bytes previously loaded/written by the native owner.
// An unknown baseline is not an absent file and never authorizes persistence.
message NativeFileBaselineState {
  string path = 1;
  string baseline_path = 2;
  bool baseline_known = 3;
  bool baseline_exists = 4;
  string baseline_sha256 = 5;
  uint64 baseline_bytes = 6;
  bool current_known = 7;
  bool current_exists = 8;
  string current_sha256 = 9;
  uint64 current_bytes = 10;
  NativeFileBaselineStatus status = 11;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

message DocumentLifecycleState {
  kiapi.common.types.DocumentSpecifier document = 1;
  DocumentRevision revision = 2;
  string native_identity = 3;
  string state_sha256 = 4;
  DocumentLifecycleScope scope = 5;
  bool native_content_dirty = 6;
  bool project_settings_included = 7;
  bool complete_change_tracking = 8;
  bool disk_baseline_checked = 9;
  repeated string native_files = 10;
  repeated NativeFileBaselineState file_baselines = 11;
  string process_epoch = 12;
  // Exact native state at a successful load/save checkpoint; empty means unavailable.
  string clean_checkpoint_sha256 = 13;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
  // -- lane 2D (400-499) --
  // -- end lane 2D --
}

message CheckedSaveDocument {
  kiapi.common.types.DocumentSpecifier document = 1;
  string operation_id = 2;
  DocumentLifecycleState expected_state = 3;
  // -- lane 2D (400-499) --
  // -- end lane 2D --
}

// Clean-only: this request never authorizes saving or discarding unsaved changes.
message CheckedCloseDocument {
  kiapi.common.types.DocumentSpecifier document = 1;
  string operation_id = 2;
  DocumentLifecycleState expected_state = 3;
  // -- lane 2D (400-499) --
  // -- end lane 2D --
}

message ReadLifecycleOperation {
  kiapi.common.types.DocumentSpecifier document = 1;
  string operation_id = 2;
  string process_epoch = 3;
}

enum LifecycleOperationStatus {
  LOS_UNKNOWN = 0;
  LOS_SAVED = 1;
  LOS_REJECTED = 2;
  LOS_FAILED = 3;
  LOS_INDETERMINATE = 4;
  LOS_CLOSED = 5;
}

message LifecycleOperationResult {
  kiapi.common.types.DocumentSpecifier document = 1;
  string operation_id = 2;
  string process_epoch = 3;
  LifecycleOperationStatus status = 4;
  string error_code = 5;
  string error_message = 6;
  DocumentLifecycleState observed_state = 7;
  // -- lane 2D (400-499) --
  // Observed document files this save replaced on disk, in write order. A failed save that lists
  // files here left the disk partly updated; the editor still holds the complete design.
  repeated string written_files = 400;
  // Observed document files KiCad could not write (read-only file or folder, full disk, ...).
  // The error message says why for each one.
  repeated string blocked_files = 401;
  // -- end lane 2D --
}

message SchematicSaveState {
  kiapi.common.types.DocumentSpecifier document = 1;
  DocumentRevision revision = 2;
  bool tracking_complete = 3;
  bool unsaved_schematic_changes = 4;
  repeated kiapi.common.types.DocumentSpecifier modified_sheet_instances = 5;
  bool project_settings_checked = 6;
}

message SchematicMetadataSnapshot {
  kiapi.schematic.types.SchematicMetadata metadata = 1;
  DocumentRevision revision = 2;
  bool tracking_complete = 3;
}

message ReadSchematicScreenData {
  kiapi.common.types.DocumentSpecifier document = 1;
  uint32 schema_version = 2;
}

message SchematicScreenDataSnapshot {
  kiapi.schematic.types.SchematicScreenData data = 1;
  DocumentRevision revision = 2;
  bool tracking_complete = 3;
}

message ReadSchematicHierarchyData {
  kiapi.common.types.DocumentSpecifier document = 1;
  uint32 schema_version = 2;
}

message SchematicHierarchyDataSnapshot {
  kiapi.schematic.types.SchematicHierarchyData data = 1;
  DocumentRevision revision = 2;
  bool tracking_complete = 3;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

// One native checkpoint for electrical reconciliation. Net names are display
// values, not persistent net identities; memberships use sheet paths and UUIDs.
message ReadSchematicElectricalState {
  kiapi.common.types.DocumentSpecifier document = 1;
  uint32 schema_version = 2;
  // Optional observation precondition, not native mutation admission.
  DocumentRevision expected_revision = 3;
}

message SchematicElectricalState {
  SchematicHierarchyDataSnapshot hierarchy = 1;
  repeated kiapi.schematic.types.SchematicNet nets = 2;
  repeated string limitations = 3;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

// Current-canvas capture and supported objects collected in one native dispatch.
// Incomplete tracking/serializer coverage remain explicit; not edit admission.
message CaptureSchematicObservation {
  kiapi.common.types.DocumentSpecifier document = 1;
  uint32 schema_version = 2;
}

message SchematicObservation {
  SchematicScreenDataSnapshot snapshot = 1;
  SchematicPreview preview = 2;
}

// Discovery does not imply support for editing, rendering or synchronization.
message GetAutomationSession {}

message AutomationSession {
  uint32 protocol_version = 1;
  string instance_id = 2;
  string project_path = 3;
  string epoch = 4;
  repeated string capabilities = 5;
  // Separate local notification channel; no request may infer another endpoint.
  string event_endpoint = 6;
  string event_epoch = 7;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
  // -- lane 2D (400-499) --
  // Says what capabilities lists. Peers built before this field send NCP_LEGACY_LABELS.
  NativeCapabilityFormat capability_format = 400;
  // -- end lane 2D --
}

// Notifications are hints to committed state, not a replacement for native
// snapshots or the recovery journal. The process and event epochs must match
// explicit discovery. Sequence increases for changes, not heartbeats. Initial
// attachment, changed event epoch, or a gap requires fresh state; a heartbeat
// advertises the latest sequence even if the last change packet was lost.
message AutomationEvent {
  uint32 protocol_version = 1;
  string instance_id = 2;
  string process_epoch = 3;
  string event_epoch = 4;
  uint64 sequence = 5;
  oneof payload {
    AutomationHeartbeat heartbeat = 6;
    SchematicCommitNotification schematic_commit = 7;
    // 20-29: held for the Phase 3 recursive-diagram document notifications
    // (contract rbg-v2 section 13), declared by the parent at a later freeze.
    // -- lane 2C (300-399) --
    // -- end lane 2C --
  }
  // -- lane 2D (400-499) --
  // -- end lane 2D --
}

message AutomationHeartbeat {}

message SchematicCommitNotification {
  // Canonical first top-level sheet path (never the virtual nil-UUID root).
  // The journal covers all loaded sheet instances; this is not a touched-sheet list.
  kiapi.common.types.DocumentSpecifier document = 1;
  DocumentRevision revision = 2;
  SchematicChange change = 3;
  bool tracking_complete = 4;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

// An epoch changes when its native process restarts. Sequence numbers alone
// must never be compared across epochs.
message DocumentRevision {
  string epoch = 1;
  uint64 sequence = 2;
}

// Native preview plumbing. Not a revision-safe observation or mutation token;
// do not expose this as the completed observation contract through MCP.
message CaptureSchematicPreview {
  kiapi.common.types.DocumentSpecifier document = 1;
}

// Navigate the native editor to an exact hierarchy instance. Returns the
// activated DocumentSpecifier; this is not a design mutation or revision token.
message ActivateSchematicSheet {
  kiapi.common.types.DocumentSpecifier document = 1;
}

message SchematicPreview {
  kiapi.common.types.DocumentSpecifier document = 1;
  bytes png = 2;
  uint32 width_pixels = 3;
  uint32 height_pixels = 4;
  // Diagnostic cursor only until tracking_complete is true. This does not
  // authorize mutations or claim complete coverage of native edit paths.
  DocumentRevision revision = 5;
  bool tracking_complete = 6;
  SchematicViewport viewport = 7;
}

// Affine pixel-to-sheet transform, in nanometres. Pixel (0,0) is the
// top-left of the canvas, x increases right and y increases down.
message SchematicViewport {
  double origin_x_nm = 1;
  double origin_y_nm = 2;
  double pixel_x_dx_nm = 3;
  double pixel_x_dy_nm = 4;
  double pixel_y_dx_nm = 5;
  double pixel_y_dy_nm = 6;
  repeated int32 visible_native_layers = 7;
  // Actual keyboard focus at a live canvas rendering checkpoint. Independent
  // offscreen views have no keyboard focus and leave this false.
  bool canvas_has_keyboard_focus = 8;
}

// Independent region images of an explicitly targeted loaded sheet; never navigates
// the human view. Output regions are aspect-fitted with an exact affine transform.
message RenderSchematicViews {
  kiapi.common.types.DocumentSpecifier document = 1;
  repeated SchematicRenderView views = 2;
  uint32 schema_version = 3;
}

message SchematicRenderView {
  string key = 1;
  kiapi.common.types.Box2 region = 2;
  uint32 width_pixels = 3;
  uint32 height_pixels = 4;
  // Empty selects all supported artwork layers, independently of GUI visibility.
  repeated int32 native_layers = 5;
}

message SchematicRenderLayer {
  int32 id = 1;
  string name = 2;
}

message RenderedSchematicView {
  string key = 1;
  SchematicPreview preview = 2;
}

message SchematicViewSet {
  SchematicScreenDataSnapshot snapshot = 1;
  repeated RenderedSchematicView views = 2;
  repeated SchematicRenderLayer available_layers = 3;
  repeated string limitations = 4;
}

// Native current-sheet geometry facts for presentation checks. These do not
// imply independent rendering, full glyph/clip coverage or safe edit admission.
// Read-only measurement of detached symbol proposals and existing obstacles.
// Never inserts items or navigates the human editor to measure another sheet.
message MeasureSchematicPlacement {
  kiapi.common.types.DocumentSpecifier document = 1;
  DocumentRevision expected_revision = 2;
  repeated kiapi.schematic.types.SchematicSymbolInstance candidates = 3;
  uint32 schema_version = 4;
  // Detached LocalLabel, GlobalLabel or HierarchicalLabel prototypes. Like
  // candidates: a canonical new UUID absent from the document and unique in the
  // request, a position on the 100 nm quantum and single-line text. Never
  // inserted or committed. At most 256 candidates and item candidates together.
  repeated google.protobuf.Any item_candidates = 5;
  // 6: reserved for explicit variant selection (p20323), declared at a later seam freeze.
  // -- lane 2A (100-199) --
  // -- end lane 2A --
}

message SchematicPlacementGeometry {
  kiapi.common.types.DocumentSpecifier document = 1;
  DocumentRevision revision = 2;
  kiapi.common.types.KIID screen_id = 3;
  kiapi.common.types.Box2 page_bounds = 4;
  repeated SchematicPlacementBounds obstacles = 5;
  repeated SchematicPlacementBounds candidates = 6;
  // Bounding envelopes are conservative. They are not a readability pass.
  repeated string limitations = 7;
  // False on older servers; per-symbol completeness remains separate.
  bool pin_geometry_available = 8;
  // One entry per request item candidate, in request order: the candidate id,
  // its position as anchor and the envelope native renders after insertion
  // (label body and visible fields, including an automatic intersheet-references
  // field). symbol_pins is absent.
  repeated SchematicPlacementBounds item_candidates = 9;
  // 10: held for the CN-1 milestone 2 measurement extension, declared at a later seam freeze.
  // -- lane 2A (100-199) --
  // -- end lane 2A --
}

message SchematicPlacementBounds {
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Vector2 anchor = 2;
  kiapi.common.types.Box2 bounds = 3;
  // Absent for objects other than symbols. Never infer pins from the envelope.
  SchematicSymbolPinGeometry symbol_pins = 4;
  // -- lane 2A (100-199) --
  // -- end lane 2A --
}

enum SchematicPinGeometryIncompleteReason {
  // Complete geometry, or a peer that predates this field.
  SPGIR_UNSPECIFIED = 0;
  SPGIR_DEFINITION_UNRESOLVED = 1;
  SPGIR_PLACED_IDENTITY_MISSING = 2;
  SPGIR_VARIANT_PIN_MAPPING_UNRESOLVED = 3;
  // 4-7: reserved for exact variant pin identities (p20323), declared at a later seam freeze.
}

message SchematicSymbolPinGeometry {
  bool complete = 1;
  repeated SchematicPinAnchor pins = 2;
  repeated string limitations = 3;
  // Set whenever complete is false.
  SchematicPinGeometryIncompleteReason incomplete_reason = 4;
  // 5: reserved for per-variant pin geometry (p20323), declared at a later seam freeze.
  // -- lane 2A (100-199) --
  // -- end lane 2A --
}

enum SchematicPinPowerScope {
  SPPS_NONE = 0;
  SPPS_GLOBAL = 1;
  SPPS_LOCAL = 2;
}

message SchematicPinAnchor {
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.KIID library_pin_id = 2;
  string number = 3;
  string name = 4;
  // Electrical connection point in schematic sheet-space nanometres.
  kiapi.common.types.Vector2 position = 5;
  // Dimensionless signed unit vector from the connection toward the pin body.
  int32 body_direction_x = 6;
  int32 body_direction_y = 7;
  // Zero means common to all units/body styles, not the selected occurrence.
  int32 unit = 8;
  int32 body_style = 9;
  bool visible = 10;
  // Effective type, with the active alternate applied.
  kiapi.common.types.ElectricalPinType electrical_type = 11;
  // Whether this placed pin is an implicit global or local power connection.
  SchematicPinPowerScope power_scope = 12;
  // Resolved implicit net name (the power symbol's value on this sheet path, or
  // the shown pin name); empty when power_scope is SPPS_NONE.
  string power_net = 13;
  // 14: held for CN-1 connected realization, declared at a later seam freeze.
  // -- lane 2A (100-199) --
  // -- end lane 2A --
}

message ReadSchematicPresentationFacts {
  kiapi.common.types.DocumentSpecifier document = 1;
  // -- lane 2A (100-199) --
  // -- end lane 2A --
}

message SchematicPresentationFacts {
  kiapi.common.types.DocumentSpecifier document = 1;
  DocumentRevision revision = 2;
  kiapi.common.types.Box2 page_bounds = 3;
  repeated SchematicPresentationObject objects = 4;
  bool coverage_complete = 5;
  repeated string limitations = 6;
  repeated SchematicPresentationWire wires = 7;
  repeated kiapi.common.types.Vector2 junctions = 8;
  // -- lane 2A (100-199) --
  // -- end lane 2A --
}

message SchematicPresentationWire {
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Vector2 start = 2;
  kiapi.common.types.Vector2 end = 3;
  // Native graph code, scoped to the document revision. Not a persistent XML net ID.
  string signal_key = 4;
  // -- lane 2A (100-199) --
  // -- end lane 2A --
}

message SchematicPresentationObject {
  enum Kind { UNKNOWN = 0; GRAPHIC = 1; IMAGE = 2; TEXT = 3; REFERENCE_DESIGNATOR = 4; }
  kiapi.common.types.KIID id = 1;
  Kind kind = 2;
  kiapi.common.types.Box2 bounds = 3;
  bool visible = 4;
  optional int64 text_height_nm = 5;
  string text = 6;
  // Fields have native runtime identities. Address persistent edits through
  // their owning symbol/sheet and field name, not a field UUID across reloads.
  kiapi.common.types.KIID owner_id = 7;
  string field_name = 8;
  // Text-box/table container bounds do not include overflowing text. Native
  // font metrics, transformed to sheet coordinates; not a clipping rectangle.
  kiapi.common.types.Box2 text_bounds = 9;
  // -- lane 2A (100-199) --
  // -- end lane 2A --
}

// Recovery-journal foundation. Until tracking_complete becomes true, this
// cursor MUST NOT be used as a document mutation precondition. Live delivery,
// complete property coverage and change payloads are separate unfinished work.
message ReadSchematicChangeJournal {
  kiapi.common.types.DocumentSpecifier document = 1;
  string document_epoch = 2;
  uint64 after_sequence = 3;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

message SchematicChangeJournal {
  string document_epoch = 1;
  uint64 sequence = 2;
  bool reset_required = 3;
  bool tracking_complete = 4;
  repeated SchematicChange changes = 5;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

message SchematicChange {
  enum Kind {
    UNKNOWN = 0;
    COMMIT = 1;
    UNDO = 2;
    REDO = 3;
    // -- lane 2C (300-399) --
    // -- end lane 2C --
  }
  uint64 sequence = 1;
  Kind kind = 2;
  string description = 3;
  // Empty for ordinary native edits, including user undo/redo. Attribution
  // identifies the original automation commit, not all later uses of its undo.
  string origin_id = 4;
  string operation_id = 5;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

// Native atomic-commit primitive. Not exposed as a completed MCP mutation:
// complete revision admission is still required there. Retry receipts are
// retained in the native document session, not across document epochs.
message ApplySchematicItemBatch {
  kiapi.common.types.DocumentSpecifier document = 1;
  repeated SchematicItemOperation operations = 2;
  string description = 3;
  // Retry identity is scoped to the document epoch. Both fields must be set
  // together. This does not replace the still-unfinished revision admission.
  string operation_id = 4;
  string document_epoch = 5;
  // Reject mismatched committed-change cursors before mutation. Current
  // tracking remains partial: matching this value is NOT proof that every
  // persisted property is unchanged. Public mutation readiness requires
  // complete revision tracking as well as this admission guard.
  DocumentRevision expected_revision = 6;
  // Optional synchronization origin. Requires retry identity and expected
  // revision. Recorded only when this batch actually commits a change.
  string origin_id = 7;
  // Optional serialized reply allowance, enforced before the native commit.
  // Zero retains the ordinary native receipt budget. The checked controller
  // sets a bounded allowance from its remaining process-owned receipt space.
  uint32 maximum_result_bytes = 8;
  // -- lane 2A (100-199) --
  // -- end lane 2A --
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

// A separate command, not an optional guard on a legacy batch: an older peer
// must reject it rather than ignore the precondition and execute unchecked.
message CheckedSchematicBatch {
  ApplySchematicItemBatch batch = 1;
  DocumentLifecycleState expected_state = 2;
  // -- lane 2A (100-199) --
  // -- end lane 2A --
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

// Capture the planner input and the checked-batch precondition at one native
// checkpoint. Only a root schematic target is valid for this whole-design read.
message ReadCheckedSchematicState {
  kiapi.common.types.DocumentSpecifier document = 1;
  string process_epoch = 2;
}

message CheckedSchematicState {
  DocumentLifecycleState state = 1;
  SchematicElectricalState electrical = 2;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

message ReadCheckedSchematicBatchReceipt {
  kiapi.common.types.DocumentSpecifier document = 1;
  string process_epoch = 2;
  string operation_id = 3;
  CheckedSchematicBatch expected_request = 4;
}

enum CheckedSchematicBatchStatus {
  CSBS_UNKNOWN = 0;
  CSBS_NOT_FOUND = 1;
  CSBS_REJECTED = 2;
  CSBS_COMPLETED = 3;
  // Native execution may have occurred. Inspect preserved state; never retry
  // with a new operation ID merely because its post-observation failed.
  CSBS_INDETERMINATE = 4;
}

message CheckedSchematicBatchReceipt {
  kiapi.common.types.DocumentSpecifier document = 1;
  string process_epoch = 2;
  string operation_id = 3;
  CheckedSchematicBatchStatus status = 4;
  bool expected_request_verified = 5;
  SchematicItemBatchResult result = 6;
  DocumentLifecycleState observed_before = 7;
  DocumentLifecycleState observed_after = 8;
  string error_code = 9;
  string error_message = 10;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
  // -- lane 2D (400-499) --
  // -- end lane 2D --
}

message SchematicItemOperation {
  // Optional per-operation target within the same loaded schematic. Absence
  // uses the enclosing batch target. All operations share one native commit.
  kiapi.common.types.DocumentSpecifier target_document = 8;
  oneof operation {
    google.protobuf.Any create = 1;
    google.protobuf.Any update = 2;
    kiapi.common.types.KIID remove = 3;
    // Replace schematic-owned assets, not symbol-local assets. Validated with
    // the native decoder before application; participates in this batch's undo.
    SchematicEmbeddedFileState replace_embedded_files = 4;
    kiapi.schematic.types.SchematicRootInstance set_root_instance = 5;
    // Replace the explicitly targeted screen's title block in the same commit.
    kiapi.common.types.TitleBlockInfo set_title_block = 6;
    kiapi.common.types.PageSettings set_page_settings = 7;
    SchematicBusAliasState replace_bus_aliases = 9;
    SchematicTextVariableState replace_text_variables = 10;
    SchematicNetChainState replace_net_chains = 11;
    SchematicVariantRegistryState replace_variant_registry = 12;
    kiapi.schematic.types.SchematicDrawingRatios set_drawing_ratios = 13;
    SchematicLibraryCacheState replace_library_cache = 14;
    kiapi.schematic.types.SchematicFormattingSettings set_formatting = 15;
    SchematicConnectedSymbolMove move_connected_symbols = 16;
    // Complete validated ERC replacement. Clients must discover actual native
    // support; older handlers do not implement this operation.
    kiapi.schematic.types.SchematicErcSettings set_erc_settings = 17;
    kiapi.schematic.types.SchematicNetChainClassState replace_net_chain_classes = 18;
    kiapi.schematic.types.SchematicAnnotationSettings set_annotation = 19;
    kiapi.schematic.types.SchematicReferenceInventory set_reference_inventory = 20;
    kiapi.schematic.types.SchematicFieldTemplates set_field_templates = 21;
    kiapi.schematic.types.SchematicSymbolComparisonSettings set_symbol_comparison = 22;
    kiapi.schematic.types.SchematicBomSettings set_bom_settings = 23;
    kiapi.schematic.types.SchematicNetSettings set_net_settings = 24;
    SchematicConnectedSymbolTransform transform_connected_symbols = 25;
    SchematicSymbolLocks set_symbol_locks = 26;
    // At most one, and only as the final operation, without target_document and
    // alongside only create, update and replace_library_cache operations. The
    // batch needs operation_id and expected_revision. A mismatch rejects the whole
    // batch with the prefix "connectivity_postcondition_failed:" and no state change.
    SchematicConnectivityAssertion assert_connectivity = 27;
    // -- lane 2A (100-199) --
    // -- end lane 2A --
    // -- lane 2C (300-399) --
    // -- end lane 2C --
  }
}

// Finite native drag, not an interactive mouse action. Uses the explicitly
// targeted loaded sheet and all of its active units. The enclosing batch owns undo,
// revision admission and retry identity. Connected wires/labels may also change.
message SchematicConnectedSymbolMove {
  repeated kiapi.common.types.KIID symbols = 1;
  kiapi.common.types.Vector2 delta = 2;
}

enum SchematicConnectedTransformKind {
  SCT_UNKNOWN = 0;
  SCT_ROTATE_CLOCKWISE = 1;
  SCT_ROTATE_COUNTERCLOCKWISE = 2;
  SCT_MIRROR_LEFT_RIGHT = 3;
  SCT_MIRROR_UP_DOWN = 4;
}

// Relative transform around an explicit sheet-space pivot in nanometers.
// Left/right reverses X around pivot.x; up/down reverses Y around pivot.y.
// Attached wire ends and labels participate; all-instance pin connectivity
// must remain equivalent. Does not request automatic field placement.
message SchematicConnectedSymbolTransform {
  repeated kiapi.common.types.KIID symbols = 1;
  kiapi.common.types.Vector2 pivot = 2;
  SchematicConnectedTransformKind kind = 3;
}

// Changes only the lock flag, preserving geometry already produced earlier in
// the same native batch. Shared sheet instances refer to one physical symbol.
message SchematicSymbolLocks {
  repeated kiapi.common.types.KIID symbols = 1;
  kiapi.common.types.LockedState locked = 2;
}

// Exact final pin partition of a batch: the groups it states replace every
// captured group they touch, and every other group stays unchanged.
message SchematicConnectivityAssertion {
  // Must be 1.
  uint32 version = 1;
  // Complete final membership of every affected group; nonempty and disjoint.
  repeated SchematicPinGroup expected_groups = 2;
  // 3-5: held for the CN-1 native assertion, declared at a later seam freeze.
  // -- lane 2A (100-199) --
  // -- end lane 2A --
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

// Exact loaded sheet-instance path (packed like SchematicNetSheetContents.path)
// plus the placed pin UUID.
message SchematicPinGroup {
  repeated kiapi.schematic.types.SchematicNetChainPinAnchor pins = 1;
}

message SchematicLibraryCacheState {
  // Stable screen identity also admits cache ownership before sheet reparenting.
  kiapi.common.types.KIID screen_id = 1;
  repeated kiapi.schematic.types.SchematicCachedSymbol definitions = 2;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

message SchematicEmbeddedFileState {
  kiapi.common.types.EmbeddedFiles files = 1;
  bool embedded_fonts = 2;
}

message SchematicBusAliasState {
  repeated kiapi.schematic.types.SchematicBusAlias aliases = 1;
}

message SchematicTextVariableState {
  map<string, string> variables = 1;
}

message SchematicNetChainState {
  // Full replacement of schematic-wide declarations. committed is an
  // observation, not an instruction; callers must clear it on every entry.
  repeated kiapi.schematic.types.SchematicNetChainDefinition definitions = 1;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

message SchematicVariantRegistryState {
  // Replace only explicit project entries. Does not rename/delete symbol or
  // sheet-instance variant declarations; those remain separately owned data.
  map<string, string> descriptions = 1;
}

message SchematicItemBatchResult {
  repeated google.protobuf.Any items = 1;
  repeated kiapi.common.types.KIID removed = 2;
  bool embedded_files_changed = 3;
  bool root_instance_changed = 4;
  bool title_block_changed = 5;
  bool page_settings_changed = 6;
  // Effective targets in request operation order, including metadata edits.
  repeated kiapi.common.types.DocumentSpecifier operation_targets = 7;
  bool bus_aliases_changed = 8;
  bool text_variables_changed = 9;
  bool net_chains_changed = 10;
  bool variant_registry_changed = 11;
  bool drawing_ratios_changed = 12;
  bool library_cache_changed = 13;
  bool formatting_changed = 14;
  // Revision immediately after this operation (unchanged for a no-op).
  // Retried operations retain their original result, not the current revision.
  DocumentRevision revision = 15;
  bool tracking_complete = 16;
  bool erc_settings_changed = 17;
  bool net_chain_classes_changed = 18;
  bool annotation_changed = 19;
  bool reference_inventory_changed = 20;
  bool field_templates_changed = 21;
  bool symbol_comparison_changed = 22;
  bool bom_settings_changed = 23;
  bool net_settings_changed = 24;
  // True only when an assert_connectivity operation was evaluated and passed.
  bool connectivity_assertion_verified = 25;
  // -- lane 2A (100-199) --
  // -- end lane 2A --
  // -- lane 2C (300-399) --
  // -- end lane 2C --
}

message InspectSchematicOperation {
  kiapi.common.types.DocumentSpecifier document = 1;
  string document_epoch = 2;
  string operation_id = 3;
  // Optional exact saved command. When present, a found receipt must match
  // all request fields, including map contents, before it can be returned.
  ApplySchematicItemBatch expected_request = 4;
}

message SchematicOperationReceipt {
  enum State { UNKNOWN = 0; NOT_FOUND = 1; COMPLETED = 2; REJECTED = 3; INDETERMINATE = 4; }
  kiapi.common.types.DocumentSpecifier document = 1;
  string document_epoch = 2;
  string operation_id = 3;
  State state = 4;
  SchematicItemBatchResult result = 5;
  int32 native_status_code = 6;
  string failure_message = 7;
  // True only when the retained command matched expected_request. Older
  // peers and NOT_FOUND responses cannot establish payload verification.
  bool expected_request_verified = 8;
  // -- lane 2C (300-399) --
  // -- end lane 2C --
  // -- lane 2D (400-499) --
  // -- end lane 2D --
}

// == lane 2A messages ==
// == end ==

// == lane 2C messages ==
// == end ==

// == lane 2D messages ==
// NCP_LEGACY_LABELS: capabilities holds fixed descriptive labels (session.info, version.read)
// that identify no handler. NCP_REGISTERED_REQUEST_TYPES: capabilities holds, in ordinal order,
// the fully qualified request message types this process dispatches at the time of the reply,
// read from its registered handlers. Editors add their types when they open and remove them
// when they close. A dispatched request can still be rejected for its target, its arguments or
// the editor's state.
enum NativeCapabilityFormat {
  NCP_LEGACY_LABELS = 0;
  NCP_REGISTERED_REQUEST_TYPES = 1;
}
// == end ==
