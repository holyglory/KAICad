message SchematicPresentationObject {
  enum Kind { UNKNOWN = 0; GRAPHIC = 1; IMAGE = 2; TEXT = 3; REFERENCE_DESIGNATOR = 4; }
  kiapi.common.types.KIID id = 1;
  Kind kind = 2;
  kiapi.common.types.Box2 bounds = 3;
  bool visible = 4;
  optional int64 text_height_nm = 5;
  string text = 6;
  // Fields have native runtime identities. Address persistent edits through
  // their owning symbol/sheet and field name, not a field UUID across reloads.
  kiapi.common.types.KIID owner_id = 7;
  string field_name = 8;
  // Text-box/table container bounds do not include overflowing text. Native
  // font metrics, transformed to sheet coordinates; not a clipping rectangle.
  kiapi.common.types.Box2 text_bounds = 9;
  // -- lane 2A (100-199) --
  // Extent of the glyphs the schematic painter draws for this text: its draw position,
  // justification, rotation, effective stroke width, font and metrics, from the exact native
  // glyph geometry. Absent for objects without painted glyphs.
  kiapi.common.types.Box2 glyph_bounds = 100;
  // Painted reading direction in degrees counter-clockwise, in [0, 360): 0 reads left to right,
  // 90 bottom to top, 180 upside down, 270 top to bottom. Absent for objects without text.
  optional double reading_angle_degrees = 101;
  // The reference designator of a symbol that must show one: every symbol except power and
