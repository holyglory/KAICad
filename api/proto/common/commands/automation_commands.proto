// Terminal result of the native PCB zone filler. This intentionally mirrors
// ZONE_FILLER::OUTCOME so managed callers never infer success from editor
// responsiveness or the legacy completed bit alone.
enum NativeZoneFillOutcome {
  NZFO_UNKNOWN = 0;
  NZFO_NOT_RUN = 1;
  NZFO_COMPLETED = 2;
  NZFO_CANCELLED = 3;
  NZFO_NOT_CONVERGED = 4;
  NZFO_UNCHANGED_OR_DECLINED = 5;
  NZFO_FAILED = 6;
}

