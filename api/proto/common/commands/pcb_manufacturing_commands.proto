/* Typed PCB manufacturing exports and process-owned receipts. GPL-3.0-or-later. */
syntax = "proto3";

package kiapi.automation.v1;
option csharp_namespace = "KiCad.Automation.Protocol";

import "board/board_jobs.proto";
import "common/commands/automation_commands.proto";
import "common/types/base_types.proto";

// Runs one existing native PCB board-job exporter into a new, owned output
// directory. The concrete job payloads remain the existing board-job messages;
// this envelope adds lifecycle admission, operation identity and publication.
message RunPcbManufacturingExport
{
  string operation_id = 1;
  string process_epoch = 2;
  kiapi.common.types.DocumentSpecifier document = 3;
  DocumentLifecycleState expected_state = 4;
  // Must be absolute and must not exist before admission. The native handler
  // stages into a sibling directory and publishes this directory atomically.
  string output_directory = 5;

  oneof job
  {
    kiapi.board.jobs.RunBoardJobExport3D export_3d = 20;
    kiapi.board.jobs.RunBoardJobExportRender export_render = 21;
    kiapi.board.jobs.RunBoardJobExportSvg export_svg = 22;
    kiapi.board.jobs.RunBoardJobExportDxf export_dxf = 23;
    kiapi.board.jobs.RunBoardJobExportPdf export_pdf = 24;
    kiapi.board.jobs.RunBoardJobExportPs export_ps = 25;
    kiapi.board.jobs.RunBoardJobExportGerbers export_gerbers = 26;
    kiapi.board.jobs.RunBoardJobExportDrill export_drill = 27;
    kiapi.board.jobs.RunBoardJobExportPosition export_position = 28;
    kiapi.board.jobs.RunBoardJobExportGencad export_gencad = 29;
    kiapi.board.jobs.RunBoardJobExportIpc2581 export_ipc2581 = 30;
    kiapi.board.jobs.RunBoardJobExportIpcD356 export_ipc_d356 = 31;
    kiapi.board.jobs.RunBoardJobExportODB export_odb = 32;
    kiapi.board.jobs.RunBoardJobExportStats export_stats = 33;
  }
}

message ReadPcbManufacturingExport
{
  kiapi.common.types.DocumentSpecifier document = 1;
  string operation_id = 2;
  string process_epoch = 3;
}

// Opt-in manager admission. The existing RunPcbManufacturingExport remains
// synchronous; this command never borrows its GUI exporter on a worker.
message StartPcbManufacturingExportJob
{
  // -- lane 2D (400-499) --
  RunPcbManufacturingExport request = 400;
  // -- end lane 2D --
}

message ReadPcbManufacturingExportJob
{
  // -- lane 2D (400-499) --
  kiapi.common.types.DocumentSpecifier document = 400;
  string operation_id = 401;
  string process_epoch = 402;
  string request_fingerprint_sha256 = 403;
  // -- end lane 2D --
}

message GetPcbManufacturingManagerCapabilities
{
  // -- lane 2D (400-499) --
  kiapi.common.types.DocumentSpecifier document = 400;
  string process_epoch = 401;
  // -- end lane 2D --
}

message PcbManufacturingManagerCapabilities
{
  // -- lane 2D (400-499) --
  kiapi.common.types.DocumentSpecifier document = 400;
  string process_epoch = 401;
  bool admission_supported = 402;
  bool request_journal_supported = 403;
  bool journal_read_supported = 404;
  bool cancellation_before_dispatch_supported = 405;
  bool prior_epoch_journal_inspection_supported = 406;
  bool detached_export_supported = 407;
  bool publication_supported = 408;
  bool complete_snapshot_supported = 409;
  string unavailable_reason = 410;
  // The current manager can dispatch SVG synchronously on the owning editor
  // thread. This does not imply a detached worker, restart publication or a
  // complete dependency snapshot.
  bool synchronous_svg_export_supported = 411;
  bool manager_worker_boundary_supported = 412;
  bool cooperative_worker_cancellation_supported = 413;
  bool worker_join_supported = 414;
  // -- end lane 2D --
}

// Native manager recovery controls. Fields 1-33 above are frozen for the
// synchronous export contract. New cancellation/recovery fields use the
// shared lane-2D band so older peers fail closed when they cannot provide the
// manager contract.
message CancelPcbManufacturingExport
{
  kiapi.common.types.DocumentSpecifier document = 1;
  string operation_id = 2;
  string process_epoch = 3;

  // -- lane 2D (400-499) --
  // Restrict cancellation to work that has not reached native dispatch.
  bool before_native_dispatch_only = 400;
  // -- end lane 2D --
}

message ReconcilePcbManufacturingExport
{
  kiapi.common.types.DocumentSpecifier document = 1;
  string operation_id = 2;
  string process_epoch = 3;
  string request_fingerprint_sha256 = 4;

  // -- lane 2D (400-499) --
  // The epoch that admitted the operation before a native restart. The
  // current process_epoch remains the live peer identity above.
  string prior_process_epoch = 400;
  bool allow_prior_process_epoch = 401;
  // -- end lane 2D --
}

enum PcbManufacturingExportStatus
{
  PCB_MFG_EXPORT_STATUS_UNSPECIFIED = 0;
  PCB_MFG_EXPORT_ADMITTED = 1;
  PCB_MFG_EXPORT_RUNNING = 2;
  PCB_MFG_EXPORT_COMPLETED = 3;
  PCB_MFG_EXPORT_FAILED = 4;
  PCB_MFG_EXPORT_INDETERMINATE = 5;
  PCB_MFG_EXPORT_UNSUBMITTED = 6;
}

enum PcbManufacturingDispatchStage
{
  PCB_MFG_DISPATCH_UNSPECIFIED = 0;
  PCB_MFG_DISPATCH_ADMITTED = 1;
  PCB_MFG_DISPATCH_SUBMITTED = 2;
  PCB_MFG_DISPATCH_TERMINAL = 3;
  PCB_MFG_DISPATCH_PUBLICATION = 4;
  PCB_MFG_DISPATCH_PUBLICATION_FAILED = 5;
}

enum PcbManufacturingArtifactOwnership
{
  PCB_MFG_ARTIFACT_OWNERSHIP_UNSPECIFIED = 0;
  PCB_MFG_ARTIFACT_CREATED = 1;
  PCB_MFG_ARTIFACT_REPLACED = 2;
  PCB_MFG_ARTIFACT_UNCHANGED = 3;
}

enum PcbManufacturingPublicationState
{
  PCB_MFG_PUBLICATION_UNSPECIFIED = 0;
  PCB_MFG_PUBLICATION_STAGED = 1;
  PCB_MFG_PUBLICATION_PUBLISHED = 2;
  PCB_MFG_PUBLICATION_FAILED = 3;
}

message PcbManufacturingArtifact
{
  string path = 1;
  string relative_path = 2;
  uint64 bytes = 3;
  string sha256 = 4;
  PcbManufacturingArtifactOwnership ownership = 5;
}

message PcbManufacturingExportReceipt
{
  string operation_id = 1;
  string process_epoch = 2;
  kiapi.common.types.DocumentSpecifier document = 3;
  string request_fingerprint_sha256 = 4;
  string job_kind = 5;
  PcbManufacturingExportStatus status = 6;
  PcbManufacturingDispatchStage dispatch_stage = 7;
  // True once native dispatch intent is durably recorded. An indeterminate
  // terminal receipt may therefore mean the adapter could have run even when
  // no output was verified.
  bool native_dispatch = 8;
  bool terminal = 9;
  string error_code = 10;
  string error_message = 11;
  DocumentLifecycleState expected_state = 12;
  DocumentLifecycleState observed_before = 13;
  DocumentLifecycleState observed_after = 14;
  string output_directory = 15;
  string staging_directory = 16;
  repeated PcbManufacturingArtifact artifacts = 17;
  bool output_manifest_complete = 18;
  string output_manifest_sha256 = 19;
  PcbManufacturingPublicationState publication_state = 20;

  // -- lane 2D (400-499) --
  PcbManufacturingRecoveryState recovery_state = 400;
  bool cancellation_requested = 401;
  bool worker_finished = 402;
  bool publication_committed = 403;
  string source_snapshot_sha256 = 404;
  string durable_journal_sha256 = 405;
  // False until the board and all dependencies the exporter reads are
  // captured. Request/lifecycle journaling alone is not a source snapshot.
  bool snapshot_complete = 406;
  bool export_adapter_available = 407;
  // Set when the manager has started a detached worker for this operation.
  // The worker remains joinable until Join (or manager destruction) records
  // worker_joined.  Older synchronous receipts leave both fields false.
  bool worker_started = 408;
  bool worker_joined = 409;
  // -- end lane 2D --
}

message PcbManufacturingExportReceiptResponse
{
  bool found = 1;
  PcbManufacturingExportReceipt receipt = 2;

  // -- lane 2D (400-499) --
  bool reconciliation_supported = 400;
  string observing_process_epoch = 401;
  bool request_fingerprint_verified = 402;
  bool journal_verified = 403;
  bool prior_process_epoch_verified = 404;
  // True when restart reconciliation converted a prior RUNNING worker into a
  // terminal indeterminate receipt because no worker can be resumed safely.
  bool restart_reconciled = 405;
  // -- end lane 2D --
}

enum PcbManufacturingRecoveryState
{
  PCB_MFG_RECOVERY_UNKNOWN = 0;
  PCB_MFG_RECOVERY_ACTIVE = 1;
  PCB_MFG_RECOVERY_CANCEL_REQUESTED = 2;
  PCB_MFG_RECOVERY_CANCELLED = 3;
  PCB_MFG_RECOVERY_RECOVERABLE_STAGED = 4;
  PCB_MFG_RECOVERY_RECONCILED = 5;
  PCB_MFG_RECOVERY_UNSUBMITTED = 6;
}

// Native-owned on-disk journal. A SHA-256 of this message with the receipt's
// durable_journal_sha256 cleared binds its immutable request and source to its
// last durable transition. Only the native manager reads/writes these records.
message PcbManufacturingJournalRecord
{
  // -- lane 2D (400-499) --
  uint32 format_version = 400;
  RunPcbManufacturingExport request = 401;
  PcbManufacturingExportReceipt receipt = 402;
  bytes source_board = 403;
  uint64 journal_revision = 404;
  // -- end lane 2D --
}
