syntax = "proto3";
package kiapi.automation.structure.v1;
option csharp_namespace = "KiCad.Automation.Protocol.Structural";
import "common/types/structural_types.proto";

message OpenStructuralEditor {
  uint32 schema_version = 1;
  StructuralEditorDocument document = 2;
  string repository_root = 3;
  string helper_path = 4;
}
message ReadStructuralEditor { string document_id = 1; }
message StructuralEditorState {
  StructuralEditorDocument document = 1;
  bool dirty = 2;
  bool saving = 3;
  bool rendered = 4;
  uint64 revision = 5;
  uint64 completed_save_count = 6;
  string last_save_error = 7;
  string selected_block_id = 8;
}
