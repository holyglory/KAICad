/* KiCad recursive diagram and requirement history data. GPL-3.0-or-later. */
syntax = "proto3";
package kiapi.automation.diagrams.v1;
option csharp_namespace = "KiCad.Automation.Protocol.Diagrams";

import "google/protobuf/timestamp.proto";
import "common/types/structural_types.proto";

// Typed model exchange, not an independently enabled editing capability.
// Revisions pin child occurrences exactly; reading never follows today's heads.
message BlockSelectionData {
  string block_id = 1;
  string state_id = 2;
  string revision_id = 3;
}
message RequirementFieldsData { string general = 1; string schematic = 2; string routing = 3; }
enum DiagramActorKind { DAK_UNKNOWN = 0; DAK_USER = 1; DAK_AGENT = 2; DAK_IMPORT = 3; DAK_EDITOR = 4; }
enum RequirementFieldKind { RFK_UNKNOWN = 0; RFK_GENERAL = 1; RFK_SCHEMATIC = 2; RFK_ROUTING = 3; }
message DiagramRevisionOriginData {
  DiagramActorKind kind = 1;
  string actor = 2;
  google.protobuf.Timestamp recorded_at = 3;
  string summary = 4;
  repeated kiapi.automation.structure.v1.StructuralSourceReference sources = 5;
  repeated string input_ids = 6;
}
message FieldRestorationData { RequirementFieldKind field = 1; string source_revision_id = 2; }
message RequirementRevisionData {
  string id = 1;
  optional string parent_id = 2;
  RequirementFieldsData fields = 3;
  DiagramRevisionOriginData origin = 4;
  repeated FieldRestorationData restorations = 5;
}
message RequirementHistoryData {
  string document_id = 1;
  string owner_id = 2;
  string state_id = 3;
  repeated RequirementRevisionData revisions = 4;
}
message FieldHistoryEntryData {
  string requirement_revision_id = 1;
  string context_revision_id = 2;
  uint32 context_version = 3;
  string owner_name = 4;
  string text = 5;
  DiagramRevisionOriginData origin = 6;
  bool is_saved_text = 7;
}
message FieldHistoryPageData {
  string document_id = 1;
  string owner_id = 2;
  string state_id = 3;
  RequirementFieldKind field = 4;
  string context_revision_id = 5;
  uint32 context_version = 6;
  string requirement_revision_id = 7;
  string saved_text = 8;
  uint32 offset = 9;
  uint32 total = 10;
  repeated FieldHistoryEntryData entries = 11;
}
message DiagramHistoryEntryData {
  BlockSelectionData selection = 1;
  uint32 version = 2;
  string name = 3;
  DiagramRevisionOriginData origin = 4;
  uint32 child_count = 5;
  uint32 connection_count = 6;
  uint32 annotation_count = 7;
  bool is_context = 8;
}
message DiagramHistoryPageData {
  string document_id = 1;
  BlockSelectionData context = 2;
  uint32 context_version = 3;
  uint32 offset = 4;
  uint32 total = 5;
  repeated DiagramHistoryEntryData entries = 6;
}
enum DiagramChangeKind { DHCK_UNKNOWN = 0; DHCK_ADDED = 1; DHCK_REMOVED = 2; DHCK_CHANGED = 3; DHCK_REORDERED = 4; }
enum DiagramChangeCategory { DHCC_UNKNOWN = 0; DHCC_NAME = 1; DHCC_REQUIREMENT = 2; DHCC_BLOCK = 3; DHCC_CONNECTION = 4; DHCC_INTERFACE = 5; DHCC_COMMENT = 6; DHCC_DEFINITION = 7; }
message DiagramHistoryChangeData {
  DiagramChangeCategory category = 1;
  DiagramChangeKind kind = 2;
  string object_id = 3;
  string name = 4;
  RequirementFieldKind field = 5;
}
message DiagramHistoryComparisonData {
  string document_id = 1;
  BlockSelectionData context = 2;
  BlockSelectionData inspected = 3;
  uint32 context_version = 4;
  uint32 inspected_version = 5;
  DiagramRevisionOriginData inspected_origin = 6;
  repeated DiagramHistoryChangeData changes = 7;
}
message PrepareDiagramRestorationData { BlockDraftData draft = 1; BlockSelectionData source = 2; }
message BlockDesignStateData {
  string id = 1;
  string block_id = 2;
  string name = 3;
  string head_revision_id = 4;
  BlockSelectionData forked_from = 5;
  bool archived = 6;
}
enum ImplementationChangeKind { ICK_UNKNOWN = 0; ICK_RENAME = 1; ICK_ARCHIVE = 2; ICK_RESTORE = 3; }
message ImplementationChangeData {
  string id = 1; string state_id = 2; ImplementationChangeKind kind = 3;
  string before_name = 4; string after_name = 5; bool before_archived = 6; bool after_archived = 7;
  DiagramRevisionOriginData origin = 8;
}
enum DefinitionChoiceStateData { DCSD_UNSPECIFIED = 0; DCSD_UNKNOWN = 1; DCSD_CANDIDATES = 2; DCSD_SELECTED = 3; }
message DefinitionTextChoiceData {
  DefinitionChoiceStateData state = 1;
  repeated string values = 2;
  kiapi.automation.structure.v1.StructuralGuidanceStrength strength = 3;
  string applicability = 4;
  repeated kiapi.automation.structure.v1.StructuralSourceReference sources = 5;
  kiapi.automation.structure.v1.StructuralVerification verification = 6;
  optional string unknown_reason = 7;
}
message KnowledgeClassReferenceData { string library_id = 1; string library_revision = 2; string class_id = 3; }
message DefinitionClassChoiceData {
  DefinitionChoiceStateData state = 1;
  repeated KnowledgeClassReferenceData values = 2;
  kiapi.automation.structure.v1.StructuralGuidanceStrength strength = 3;
  string applicability = 4;
  repeated kiapi.automation.structure.v1.StructuralSourceReference sources = 5;
  kiapi.automation.structure.v1.StructuralVerification verification = 6;
  optional string unknown_reason = 7;
}
message BlockDefinitionData {
  DefinitionTextChoiceData purpose = 1;
  DefinitionTextChoiceData type = 2;
  DefinitionTextChoiceData manufacturer = 3;
  DefinitionTextChoiceData family = 4;
  DefinitionTextChoiceData model = 5;
  DefinitionTextChoiceData orderable_part = 6;
  DefinitionTextChoiceData package = 7;
  DefinitionClassChoiceData knowledge_class = 8;
}
message BlockRevisionData {
  BlockSelectionData selection = 1;
  optional string parent_revision_id = 2;
  string name = 3;
  string requirement_revision_id = 4;
  repeated BlockSelectionData children = 5;
  DiagramRevisionOriginData origin = 6;
  BlockSelectionData restored_from = 7;
  BlockLocalDiagramData local_diagram = 8;
  BlockDefinitionData definition = 9;
  BlockComponentBindingsData component_bindings = 10;
}
// Exact electrical realizations are independent of chosen model/package text.
message ComponentRealizationData { string design_id = 1; string circuit_id = 2; string component_id = 3; }
message BlockComponentBindingsData { repeated ComponentRealizationData targets = 1; }
message RecursiveBlockGraphData {
  uint32 schema_version = 1;
  string document_id = 2;
  BlockSelectionData selected_root = 3;
  repeated BlockDesignStateData states = 4;
  repeated BlockRevisionData revisions = 5;
  repeated RequirementHistoryData requirement_histories = 6;
  repeated ConnectionArchiveData connection_archives = 7;
  repeated ImplementationChangeData implementation_changes = 8;
}

message RecursiveEditorDocument {
  uint32 schema_version = 1;
  string document_id = 2;
  string source_path = 3;
  string source_token = 4;
  RecursiveBlockGraphData graph = 5;
}
enum RecursiveFileAction { RFA_READ = 0; RFA_BLOCK_FIELD_HISTORY = 1; RFA_CONNECTION_FIELD_HISTORY = 2; RFA_SAVE_BLOCK = 3; RFA_REBASE_REQUIREMENTS = 4; RFA_SAVE_CONNECTION = 5; RFA_SAVE_IMPLEMENTATION = 6; RFA_MANAGE_IMPLEMENTATION = 7; RFA_DIAGRAM_HISTORY = 8; RFA_COMPARE_DIAGRAM_HISTORY = 9; RFA_PREPARE_DIAGRAM_RESTORATION = 10; }
enum ImplementationActionKind { IAK_UNKNOWN = 0; IAK_NEW = 1; IAK_DUPLICATE = 2; IAK_RENAME = 3; IAK_ARCHIVE = 4; IAK_RESTORE = 5; }
message ManageImplementationData {
  ImplementationActionKind action = 1;
  BlockSelectionData expected_root = 2;
  BlockSelectionData source = 3;
  string name = 4;
  string new_state_id = 5;
  string new_revision_id = 6;
  string new_requirement_revision_id = 7;
  string change_id = 8;
  DiagramRevisionOriginData origin = 9;
}
message ConnectionDraftData {
  ConnectionSelectionData baseline = 1;
  string name = 2;
  DiagramConnectionKind kind = 3;
  repeated DiagramEndpointBindingData endpoints = 4;
  repeated ConnectionSelectionData members = 5;
  string baseline_requirement_revision_id = 6;
  RequirementFieldsData baseline_fields = 7;
  RequirementFieldsData fields = 8;
  repeated FieldRestorationData restored_fields = 9;
  DiagramAnnotationListData diagram_annotations = 10;
}
message DiagramAnnotationListData { repeated DiagramAnnotationData annotations = 1; }
message SaveConnectionDraftData {
  BlockSelectionData expected_root = 1;
  repeated BlockSelectionData block_path = 2;
  repeated ConnectionSelectionData connection_path = 3;
  ConnectionDraftData draft = 4;
  string new_connection_revision_id = 5;
  string new_requirement_revision_id = 6;
  repeated string connection_ancestor_revision_ids = 7;
  string new_block_revision_id = 8;
  string new_block_requirement_revision_id = 9;
  repeated string block_ancestor_revision_ids = 10;
  DiagramRevisionOriginData origin = 11;
}
message RequirementConflictData { RequirementFieldKind field = 1; string baseline = 2; string draft = 3; string saved = 4; }
message RequirementResolutionData {
  string document_id = 1;
  string owner_id = 2;
  string state_id = 3;
  string baseline_revision_id = 4;
  string saved_revision_id = 5;
  RequirementFieldsData baseline = 6;
  RequirementFieldsData draft = 7;
  RequirementFieldsData saved = 8;
  RequirementFieldKind field = 9;
  string text = 10;
}
message RebaseRequirementsRequest {
  BlockDraftData draft = 1;
  repeated RequirementResolutionData resolutions = 2;
}
message RequirementMergeData {
  BlockSelectionData expected_root = 1;
  repeated BlockSelectionData block_path = 2;
  BlockDraftData original_draft = 3;
  BlockDraftData saved_draft = 4;
  BlockDraftData candidate = 5;
  repeated RequirementConflictData conflicts = 6;
  uint32 base_context_version = 7;
  uint32 saved_context_version = 8;
  DiagramRevisionOriginData saved_origin = 9;
}
message BlockDraftData {
  BlockSelectionData baseline = 1;
  string name = 2;
  repeated BlockSelectionData children = 3;
  string baseline_requirement_revision_id = 4;
  RequirementFieldsData baseline_fields = 5;
  RequirementFieldsData fields = 6;
  repeated FieldRestorationData restored_fields = 7;
  BlockSelectionData restored_from = 8;
  BlockLocalDiagramData local_diagram = 9;
  BlockDefinitionData definition = 10;
  BlockComponentBindingsData component_bindings = 11;
}
message SaveBlockDraftData {
  BlockSelectionData expected_root = 1;
  repeated BlockSelectionData block_path = 2;
  BlockDraftData draft = 3;
  string new_revision_id = 4;
  string new_requirement_revision_id = 5;
  repeated string ancestor_revision_ids = 6;
  DiagramRevisionOriginData origin = 7;
}
message RecursiveFileRequest {
  uint32 schema_version = 1;
  RecursiveFileAction action = 2;
  string repository_root = 3;
  string source_path = 4;
  string document_id = 5;
  string expected_source_token = 6;
  BlockSelectionData block = 7;
  ConnectionSelectionData connection = 8;
  RequirementFieldKind field = 9;
  int32 offset = 10;
  int32 limit = 11;
  SaveBlockDraftData save = 12;
  RebaseRequirementsRequest rebase = 13;
  SaveConnectionDraftData save_connection = 14;
  ManageImplementationData implementation = 15;
  BlockSelectionData inspected_block = 16;
  PrepareDiagramRestorationData restoration = 17;
}
message RecursiveFileResult {
  bool success = 1;
  RecursiveEditorDocument document = 2;
  FieldHistoryPageData history = 3;
  string source_token = 4;
  string error_code = 5;
  string error_message = 6;
  RequirementMergeData merge = 7;
  string implementation_id = 8;
  DiagramHistoryPageData diagram_history = 9;
  DiagramHistoryComparisonData diagram_comparison = 10;
  BlockDraftData prepared_draft = 11;
}

message DiagramBoundaryInterfaceData { string id = 1; string name = 2; string intent = 3; }
message BlockLocalDiagramData {
  repeated DiagramBoundaryInterfaceData interfaces = 1;
  repeated ConnectionSelectionData connections = 2;
  repeated DiagramAnnotationData annotations = 3;
}
enum DiagramAnnotationRole { DAR_UNKNOWN = 0; DAR_COMMENT = 1; DAR_INSTRUCTION = 2; }
enum DiagramAnnotationTargetKind { DAT_UNKNOWN = 0; DAT_CANVAS = 1; DAT_BLOCK = 2; DAT_CONNECTION = 3; }
message DiagramAnnotationPointData { string x = 1; string y = 2; }
message DiagramAnnotationStrokeData { repeated DiagramAnnotationPointData points = 1; }
message DiagramAnnotationData {
  string id = 1;
  DiagramAnnotationRole role = 2;
  string text = 3;
  DiagramAnnotationTargetKind target_kind = 4;
  optional string target_id = 5;
  optional string unresolved_reason = 6;
  DiagramAnnotationPointData position = 7;
  repeated DiagramAnnotationStrokeData strokes = 8;
  DiagramRevisionOriginData origin = 9;
  string units = 10;
}
message ConnectionSelectionData { string connection_id = 1; string state_id = 2; string revision_id = 3; }
message ConnectionDesignStateData { string id = 1; string connection_id = 2; string name = 3; string head_revision_id = 4; }
enum DiagramConnectionKind {
  DCK_UNKNOWN = 0; DCK_ABSTRACT = 1; DCK_INTERFACE = 2; DCK_SIGNAL_GROUP = 3; DCK_DIFFERENTIAL_PAIR = 4; DCK_SIGNAL = 5;
}
message ConnectionRevisionData {
  ConnectionSelectionData selection = 1;
  optional string parent_revision_id = 2;
  string name = 3;
  DiagramConnectionKind kind = 4;
  repeated DiagramEndpointBindingData endpoints = 5;
  string requirement_revision_id = 6;
  repeated ConnectionSelectionData members = 7;
  DiagramRevisionOriginData origin = 8;
}
message ConnectionArchiveData {
  string document_id = 1;
  string owner_block_id = 2;
  repeated ConnectionDesignStateData states = 3;
  repeated ConnectionRevisionData revisions = 4;
  repeated RequirementHistoryData requirement_histories = 5;
}

enum DiagramEndpointKind {
  DEK_UNKNOWN = 0;
  DEK_UNRESOLVED = 1;
  DEK_INTERFACE = 2;
  DEK_COMPATIBLE = 3;
  DEK_CANDIDATES = 4;
  DEK_PIN = 5;
}
message DiagramPinTargetData {
  string design_id = 1;
  string component_id = 2;
  repeated string sheet_instance_path = 3;
  string pin = 4;
}
message DiagramPinSelectorData {
  string role = 1;
  string protocol = 2;
  repeated string required_functions = 3;
  repeated kiapi.automation.structure.v1.StructuralSourceReference sources = 4;
}
message DiagramEndpointBindingData {
  DiagramEndpointKind kind = 1;
  string block_id = 2;
  optional string interface_id = 3;
  string intent = 4;
  DiagramPinSelectorData selector = 5;
  repeated DiagramPinTargetData candidates = 6;
  DiagramPinTargetData pin = 7;
}
