// One Save/Decline scope per diagram level, its edit commands and stale-save rebase.
message NewBlockOccurrenceData {
  BlockSelectionData selection = 1;
  string requirement_revision_id = 2;
  string implementation_name = 3;
  string name = 4;
  RequirementFieldsData fields = 5;
  repeated DiagramBoundaryInterfaceData interfaces = 6;
  BlockDefinitionData definition = 7;
  // -- lane 2B (200-299) --
  // -- end lane 2B --
}
message NewConnectionData {
  ConnectionSelectionData selection = 1;
  string requirement_revision_id = 2;
  string implementation_name = 3;
  string name = 4;
  DiagramConnectionKind kind = 5;
  DiagramDomain domain = 6;
  DiagramConnectionDirection direction = 7;
  repeated DiagramEndpointBindingData endpoints = 8;
  RequirementFieldsData fields = 9;
  InterconnectRealizationData realization = 10;
  // -- lane 2B (200-299) --
  // Round A3 (owner decision nf53af9d74841b7d3): a signal drawn into a connection of this level. It names
  // that root connection (a connection drawn in this draft, or one this draft edits and lists it among its
  // members); it is a member of that connection and never a root of its own. Unset for a root connection.
  optional string member_of = 200;
  // -- end lane 2B --
}
message LevelDraftData {
  BlockDraftData scope = 1;
  repeated BlockDraftData child_drafts = 2;
  repeated ConnectionDraftData connection_drafts = 3;
  repeated NewBlockOccurrenceData new_children = 4;
  repeated NewConnectionData new_connections = 5;
  // -- lane 2B (200-299) --
  // -- end lane 2B --
}
message RevisionIdAssignmentData { string object_id = 1; string new_revision_id = 2; string new_requirement_revision_id = 3; }
message SaveLevelDraftData {
  BlockSelectionData expected_root = 1;
  repeated BlockSelectionData block_path = 2;
  LevelDraftData draft = 3;
  string new_revision_id = 4;
  string new_requirement_revision_id = 5;
  repeated string ancestor_revision_ids = 6;
  repeated RevisionIdAssignmentData child_revisions = 7;
  repeated RevisionIdAssignmentData connection_revisions = 8;
  DiagramRevisionOriginData origin = 9;
  repeated RequirementResolutionData resolutions = 10;
  bool select_implementation = 11;
  // -- lane 2B (200-299) --
  // -- end lane 2B --
}
message SaveSummaryData {
  bool changed = 1;
  repeated BlockSelectionData created_block_revisions = 2;
  repeated ConnectionSelectionData created_connection_revisions = 3;
  uint32 pruned_presentation_entries = 4;
  BlockSelectionData selected_root = 5;
  repeated BlockSelectionData created_ancestors = 6;
  // -- lane 2B (200-299) --
  // -- end lane 2B --
}
message DiagramErrorDetailData {
  string kind = 1;
  string scope_block_id = 2;
  string object_id = 3;
  string message = 4;
  // -- lane 2B (200-299) --
  // -- end lane 2B --
}
enum LevelEditCommandKind {
  LECK_UNSPECIFIED = 0;
  LECK_REMOVE_CHILD = 1;
  LECK_REMOVE_CONNECTION = 2;
  LECK_REMOVE_INTERFACE = 3;
  // -- lane 2B (200-299) --
  // Removes signals (members) of one connection of the level: connection_id names the connection and
  // member_ids the signals; notes and realizations on them are cascaded as for a removed connection.
  LECK_REMOVE_CONNECTION_MEMBERS = 200;
  // -- end lane 2B --
}
message LevelEditCommandData {
  BlockSelectionData expected_root = 1;
  repeated BlockSelectionData block_path = 2;
  LevelDraftData draft = 3;
  LevelEditCommandKind kind = 4;
  optional string block_id = 5;
  optional string connection_id = 6;
  optional string interface_id = 7;
  bool detach_connections = 8;
  DiagramRevisionOriginData origin = 9;
  // -- lane 2B (200-299) --
  // The signals LECK_REMOVE_CONNECTION_MEMBERS removes; empty for every other removal.
  repeated string member_ids = 200;
  // -- end lane 2B --
}
enum LevelEditEffectKind {
  LEEK_UNSPECIFIED = 0;
  LEEK_CHILD_REMOVED = 1;
  LEEK_CONNECTION_REMOVED = 2;
  LEEK_INTERFACE_REMOVED = 3;
  LEEK_ANNOTATION_UNRESOLVED = 4;
  LEEK_REALIZATION_TARGET_REMOVED = 5;
  LEEK_REALIZATION_STATE_CHANGED = 6;
  LEEK_REALIZATION_REMOVED = 7;
  LEEK_PRESENTATION_ENTRY_REMOVED = 8;
  // -- lane 2B (200-299) --
  // A note whose exact target returns to this level becomes resolved again (a block moved back).
  LEEK_ANNOTATION_RESOLVED = 200;
  // -- end lane 2B --
}
message LevelEditEffectData { LevelEditEffectKind kind = 1; string object_id = 2; string scope_block_id = 3; string detail = 4; }
message LevelEditResultData { LevelDraftData draft = 1; repeated LevelEditEffectData effects = 2; }
message RebaseLevelData { LevelDraftData draft = 1; repeated RequirementResolutionData resolutions = 2; }
