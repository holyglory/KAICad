syntax = "proto3";

package kiapi.schematic.types;

import "google/protobuf/any.proto";
import "common/types/base_types.proto";
import "common/types/embedded_files.proto";
import "schematic/schematic_rules.proto";

// One native screen's top-level objects and settings collected in one handler.
// Nested fields/pins/cells remain inside their owning objects. This is not a
// complete multi-file design until metadata and unsupported-item gaps are empty.
message SchematicScreenData
{
  SchematicMetadata metadata = 1;
  repeated google.protobuf.Any items = 2;
  repeated SchematicUnrepresentedItem unrepresented_items = 3;
  // Native cache ownership is separate from placed symbol instances.
  repeated SchematicCachedSymbol cached_symbols = 4;
}

// All loaded sheet instances captured in one native dispatch. Repeated sheets
// have separate instance records but share metadata.screen_id and child IDs.
// Unsupported items/settings remain explicit; this is not full-fidelity proof.
message SchematicHierarchyData
{
  kiapi.common.types.DocumentSpecifier document = 1;
  repeated SchematicScreenData instances = 2;
}

message SchematicUnrepresentedItem
{
  kiapi.common.types.KIID id = 1;
  int32 native_type = 2;
  string reason = 3;
}

message SchematicBusAlias
{
  string name = 1;
  repeated string members = 2;
}

message SchematicNetChainTerminal
{
  string reference = 1;
  string pin = 2;
}

// Named electrical path state. Terminal references/member names match the
// persisted schematic format; per-run synthetic net keys are excluded.
message SchematicNetChainDefinition
{
  string name = 1;
  SchematicNetChainTerminal from = 2;
  SchematicNetChainTerminal to = 3;
  string net_class = 4;
  kiapi.common.types.Color color = 5;
  repeated string member_nets = 6;
  // Observation only: membership in the native committed-chain collection,
  // not a connectivity-verification result. False retains a pending declaration.
  bool committed = 7;
  // Schema 4. Presence distinguishes an explicitly empty restriction from an
  // older client that cannot represent removal intent.
  SchematicNetChainExclusions exclusions = 8;
}

message SchematicNetChainExclusions
{
  repeated string net_names = 1;
  // Exact placed pins on the removed electrical owner. Names above are its
  // recorded labels, not identities. Missing anchors leave intent unresolved.
  repeated SchematicNetChainPinAnchor pins = 2;
}

message SchematicNetChainPinAnchor
{
  kiapi.common.types.SheetPath path = 1;
  kiapi.common.types.KIID pin = 2;
}

// Typed non-item state. This is not yet the complete document snapshot.
message SchematicMetadata
{
  kiapi.common.types.DocumentSpecifier document = 1;
  kiapi.common.types.KIID screen_id = 2;
  kiapi.common.types.PageSettings page = 3;
  kiapi.common.types.TitleBlockInfo title_block = 4;
  map<string, string> text_variables = 5;
  repeated SchematicBusAlias bus_aliases = 6;
  bool embedded_fonts = 7;
  kiapi.common.types.EmbeddedFiles embedded_files = 8;
  // Never interpret an empty value set as proof that omitted state is absent.
  repeated string unrepresented_state = 9;
  SchematicRootInstance root_instance = 10;
  // Provenance, not mutable page settings. Zero loaded version means unknown
  // (for example a new unsaved screen); writer version comes from this build.
  uint32 loaded_native_format_version = 11;
  uint32 writer_native_format_version = 12;
  repeated SchematicNetChainDefinition net_chains = 13;
  // Persisted project registry, including entries without symbol overrides or
  // descriptions. Inferred names belong to symbol/instance declarations;
  // the selected editor variant and UI registry cache are transient view state.
  map<string, string> variant_descriptions = 14;
  SchematicDrawingRatios drawing_ratios = 15;
  SchematicFormattingSettings formatting = 16;
  // Absence means this peer did not capture ERC settings, not default policy
  // or permission to clear exclusions. Complete-project coverage is separate.
  SchematicErcSettings erc_settings = 17;
  // Schema 3: project class definitions are separate from chain assignments.
  // Absence is unavailable/legacy state, not an instruction to clear it.
  SchematicNetChainClassState net_chain_classes = 18;
  // Schema 5. Project policy for future annotation, not placed references or
  // the separately persisted inventory of previously allocated designators.
  SchematicAnnotationSettings annotation = 19;
}

message SchematicAnnotationSettings
{
  // Exact persisted signed value; no inference from the present symbol set.
  int32 start_after = 1;
  SchematicAnnotationOrder order = 2;
  SchematicAnnotationMethod method = 3;
  bool reuse_designators = 4;
}

enum SchematicAnnotationOrder
{
  SAO_UNKNOWN = 0;
  SAO_X_POSITION = 1;
  SAO_Y_POSITION = 2;
}

enum SchematicAnnotationMethod
{
  SAM_UNKNOWN = 0;
  SAM_INCREMENTAL = 1;
  SAM_SHEET_TIMES_100 = 2;
  SAM_SHEET_TIMES_1000 = 3;
}

message SchematicNetChainClassState
{
  repeated string definitions = 1;
  map<string, string> assignments = 2;
}

// Project-owned ERC policy and saved exclusions. A complete replacement has
// every persisted rule and every ordered pair of native electrical pin types.
// The exclusion list may be explicitly empty. Native capture/restore support
// must be qualified separately from this shared data contract.
message SchematicErcSettings
{
  repeated kiapi.schematic.ErcSeveritySetting rule_severities = 1;
  repeated SchematicErcPinRule pin_map = 2;
  repeated kiapi.schematic.ErcExclusion exclusions = 3;
}

enum SchematicErcPinConflict
{
  SEPC_UNKNOWN = 0;
  SEPC_NONE = 1;
  SEPC_WARNING = 2;
  SEPC_ERROR = 3;
  SEPC_UNCONNECTED = 4;
}

message SchematicErcPinRule
{
  kiapi.common.types.ElectricalPinType first = 1;
  kiapi.common.types.ElectricalPinType second = 2;
  SchematicErcPinConflict conflict = 3;
}

// Persisted project formatting, independent of object positions and of the
// application-wide defaults used when creating a new project. Distances must
// be exactly representable on the native schematic's 100 nm unit grid.
message SchematicFormattingSettings
{
  int64 default_line_width_nm = 1;
  int64 default_text_size_nm = 2;
  int64 pin_symbol_size_nm = 3;
  int64 connection_grid_nm = 4;
  uint32 junction_size_choice = 5;
  uint32 hop_over_size_choice = 6;
  bool show_dnp_markers = 7;
  bool show_intersheet_references = 8;
  bool list_own_page = 9;
  bool short_reference_format = 10;
  string reference_prefix = 11;
  string reference_suffix = 12;
  // Required for a complete formatting replacement; absence is not defaults.
  SchematicOperatingPointFormatting operating_point = 13;
  SchematicUnitReferenceFormatting unit_reference = 14;
}

// Exact persisted project character codes, not component identities. Separator
// zero omits the separator; native ranges are 0..126 and '1'..'z'.
message SchematicUnitReferenceFormatting
{
  uint32 separator_ascii = 1;
  uint32 first_id_ascii = 2;
}

// Persisted display preferences, not measured or simulated electrical values.
message SchematicOperatingPointFormatting
{
  uint32 voltage_precision = 1;
  string voltage_range = 2;
  uint32 current_precision = 3;
  string current_range = 4;
}

// Dimensionless project-level presentation settings from SCHEMATIC_SETTINGS.
// These are not coordinates or electrical constraints.
message SchematicDrawingRatios
{
  double dash_length_ratio = 1;
  double gap_length_ratio = 2;
  double text_offset_ratio = 3;
  double label_size_ratio = 4;
  double overbar_height_ratio = 5;
}

// The native file's own root-page record, not a placement in a parent sheet.
// Absent page_number means that no root record is stored in this file.
message SchematicRootInstance
{
  optional string page_number = 1;
}

message SchematicField
{
  // Fields do not currently track a unique ID; but may in the future
  //kiapi.common.types.KIID id = 1;
  string name = 2;
  // Native field files restore multiline-capable mode, including fields with
  // single-line content. Explicit fields must set text.attributes.multiline.
  kiapi.common.types.Text text = 3;
  bool visible = 4;
  bool show_name = 5;
  bool allow_auto_place = 6;
  bool is_private = 7;

  repeated kiapi.common.types.CustomProperty custom_properties = 8;
}

enum SchematicLineType
{
  SLT_UNKNOWN = 0;
  SLT_WIRE = 1;
  SLT_BUS = 2;
  SLT_GRAPHIC = 3;
}

/// Represents a schematic line segment, which may be a wire, bus, or graphical line
message SchematicLine
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Vector2 start = 2;
  kiapi.common.types.Vector2 end = 3;
  SchematicLineType type = 4;
  kiapi.common.types.StrokeAttributes stroke = 5;
  kiapi.common.types.LockedState locked = 6;
  kiapi.common.types.LineEnding start_ending = 7;
  kiapi.common.types.LineEnding end_ending   = 8;

  repeated kiapi.common.types.CustomProperty custom_properties = 9;
}

message Junction
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Vector2 position = 2;
  kiapi.common.types.Distance diameter = 3;
  kiapi.common.types.Color color = 4;
  kiapi.common.types.LockedState locked = 5;

  repeated kiapi.common.types.CustomProperty custom_properties = 6;
}

message NoConnectMarker
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Vector2 position = 2;
  kiapi.common.types.Distance size = 3;
  kiapi.common.types.LockedState locked = 4;

  repeated kiapi.common.types.CustomProperty custom_properties = 5;
}

enum BusEntryType
{
  BET_UNKNOWN = 0;
  BET_WIRE_TO_BUS = 1;
  BET_BUS_TO_BUS = 2;
}

message BusEntry
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Vector2 position = 2;
  kiapi.common.types.Vector2 size = 3;
  kiapi.common.types.StrokeAttributes stroke = 4;
  kiapi.common.types.LockedState locked = 5;
  BusEntryType type = 6;

  repeated kiapi.common.types.CustomProperty custom_properties = 7;
}

message SchematicText
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Text text = 2;
  kiapi.common.types.LockedState locked = 3;
  bool exclude_from_sim = 4;

  repeated kiapi.common.types.CustomProperty custom_properties = 5;
}

message SchematicTextBox
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.TextBox textbox = 2;
  kiapi.common.types.GraphicAttributes graphic_attributes = 3;
  kiapi.common.types.LockedState locked = 4;
  bool exclude_from_sim = 5;
  kiapi.common.types.Distance margin_left = 6;
  kiapi.common.types.Distance margin_top = 7;
  kiapi.common.types.Distance margin_right = 8;
  kiapi.common.types.Distance margin_bottom = 9;

  repeated kiapi.common.types.CustomProperty custom_properties = 10;
}

message SchematicGraphicShape
{
  kiapi.common.types.GraphicShape shape = 1;
  kiapi.common.types.KIID id = 2;
  kiapi.common.types.LockedState locked = 3;

  repeated kiapi.common.types.CustomProperty custom_properties = 4;
}

message SchematicImage
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Vector2 position = 2;
  kiapi.common.types.Vector2 transform_origin_offset = 3;
  kiapi.common.types.Ratio image_scale = 4;
  bytes image_data = 5;
  kiapi.common.types.LockedState locked = 6;

  repeated kiapi.common.types.CustomProperty custom_properties = 7;
}

enum SchematicLabelShape
{
  SLSH_UNKNOWN = 0;
  SLSH_INPUT = 1;
  SLSH_OUTPUT = 2;
  SLSH_BIDI = 3;
  SLSH_TRISTATE = 4;
  SLSH_PASSIVE = 5;
  SLSH_DOT = 6;
  SLSH_CIRCLE = 7;
  SLSH_DIAMOND = 8;
  SLSH_RECTANGLE = 9;
}

enum SchematicLabelSpinStyle
{
  SLSS_UNKNOWN = 0;
  SLSS_LEFT = 1;
  SLSS_UP = 2;
  SLSS_RIGHT = 3;
  SLSS_BOTTOM = 4;
}

message LocalLabel
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Vector2 position = 2;
  kiapi.common.types.Text text = 3;
  SchematicLabelSpinStyle spin_style = 4;
  repeated SchematicField fields = 5;
  kiapi.common.types.LockedState locked = 6;
  bool fields_autoplaced = 7;

  repeated kiapi.common.types.CustomProperty custom_properties = 8;
}

message GlobalLabel
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Vector2 position = 2;
  kiapi.common.types.Text text = 3;
  SchematicLabelSpinStyle spin_style = 4;
  SchematicLabelShape shape = 5;
  repeated SchematicField fields = 6;
  kiapi.common.types.LockedState locked = 7;
  SchematicField intersheet_refs_field = 8;
  bool fields_autoplaced = 9;

  repeated kiapi.common.types.CustomProperty custom_properties = 10;
}

message HierarchicalLabel
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Vector2 position = 2;
  kiapi.common.types.Text text = 3;
  SchematicLabelSpinStyle spin_style = 4;
  SchematicLabelShape shape = 5;
  repeated SchematicField fields = 6;
  kiapi.common.types.LockedState locked = 7;
  bool fields_autoplaced = 8;

  repeated kiapi.common.types.CustomProperty custom_properties = 9;
}

message DirectiveLabel
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Vector2 position = 2;
  kiapi.common.types.Text text = 3;
  SchematicLabelSpinStyle spin_style = 4;
  SchematicLabelShape shape = 5;
  repeated SchematicField fields = 6;
  kiapi.common.types.LockedState locked = 7;
  kiapi.common.types.Distance pin_length = 8;
  kiapi.common.types.Distance symbol_size = 9;
  bool fields_autoplaced = 10;

  repeated kiapi.common.types.CustomProperty custom_properties = 11;
}

message Group
{
  kiapi.common.types.KIID id = 1;
  string name = 2;
  repeated kiapi.common.types.KIID items = 3;
  kiapi.common.types.LockedState locked = 4;

  repeated kiapi.common.types.CustomProperty custom_properties = 5;
  // Native schematic (group ... (lib_id ...)) design-block provenance.
  string design_block_library_id = 6;
}

message SchematicRuleArea
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.GraphicShape shape = 2;
  kiapi.common.types.LockedState locked = 3;

  bool exclude_from_sim = 4;
  bool exclude_from_bom = 5;
  bool exclude_from_board = 6;
  bool dnp = 7;

  repeated kiapi.common.types.CustomProperty custom_properties = 8;
}

enum SheetSide
{
  SHS_UNKNOWN = 0;
  SHS_LEFT = 1;
  SHS_RIGHT = 2;
  SHS_TOP = 3;
  SHS_BOTTOM = 4;
}

message SheetPin
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Vector2 position = 2;
  kiapi.common.types.Text text = 3;
  SchematicLabelSpinStyle spin_style = 4;
  SchematicLabelShape shape = 5;
  SheetSide side = 6;
  kiapi.common.types.LockedState locked = 7;
}

message SheetSymbol
{
  kiapi.common.types.KIID id = 1;
  kiapi.common.types.Vector2 position = 2;
  kiapi.common.types.Vector2 size = 3;
  kiapi.common.types.StrokeAttributes border_stroke = 4;
  kiapi.common.types.GraphicFillAttributes fill = 5;
  kiapi.common.types.LockedState locked = 6;
  SchematicField name_field = 7;
  SchematicField filename_field = 8;
  repeated SchematicField user_fields = 9;
  repeated SheetPin pins = 10;

  // attributes shared by every instance of this sheet
  bool exclude_from_sim = 11;
  bool exclude_from_bom = 12;
  bool exclude_from_board = 13;
  bool dnp = 14;

  // The sheet that contains this instance.
  //
  // On a create or update request the targeted sheet comes from the request header, and this
  // field reports the sheet the returned instance was read from.
  kiapi.common.types.SheetPath path = 15;

  // Page numbers in KiCad are arbitrary user data and don't have to be numeric
  string page_number = 16;
  bool fields_autoplaced = 17;

  repeated kiapi.common.types.CustomProperty custom_properties = 18;

  // The variants carried by this instance.
  SheetVariants variants = 19;

  // All persisted placements of this sheet symbol. Absent on update preserves
  // existing records; present replaces them before applying the target above.
  SheetPlacementRecords instance_records = 20;

  // Identity of the referenced native screen (its persisted root UUID), not
  // this sheet symbol's identity. Repeated sheets share this ID. When supplied
  // on mutation it must match the referenced screen; a newly created empty
  // screen adopts it. Absence is supported only for legacy native requests.
  kiapi.common.types.KIID child_screen_id = 21;
}

message SheetPlacementRecord
{
  // Native parent-sheet path; the sheet symbol's own UUID is not appended.
  // Empty denotes a root-page record (page_number only).
  repeated kiapi.common.types.KIID path = 1;
  string project_name = 2;
  string page_number = 3;
  // Complete local variants. Global descriptions belong to project settings.
  SheetVariants variants = 4;
}

message SheetPlacementRecords
{
  repeated SheetPlacementRecord records = 1;
}

enum SchematicSymbolType
{
  SST_UNKNOWN = 0;
  SST_NORMAL = 1;
  SST_GLOBAL_POWER = 2;
  SST_LOCAL_POWER = 3;
}

enum SchematicSymbolOrientation
{
  SSO_UNKNOWN = 0;
  SSO_0 = 1;
  SSO_90 = 2;
  SSO_180 = 3;
  SSO_270 = 4;
}

enum SchematicPinOrientation
{
  SPO_UNKNOWN = 0;
  SPO_RIGHT = 1;
  SPO_LEFT = 2;
  SPO_UP = 3;
  SPO_DOWN = 4;
}

enum SchematicPinShape
{
  SPS_UNKNOWN = 0;
  SPS_LINE = 1;
  SPS_INVERTED = 2;
  SPS_CLOCK = 3;
  SPS_INVERTED_CLOCK = 4;
  SPS_INPUT_LOW = 5;
  SPS_CLOCK_LOW = 6;
  SPS_OUTPUT_LOW = 7;
  SPS_FALLING_EDGE_CLOCK = 8;
  SPS_NONLOGIC = 9;
}

message SchematicPinAlternate
{
  string name = 1;
  SchematicPinShape shape = 2;
  kiapi.common.types.ElectricalPinType electrical_type = 3;
}

message SchematicPin
{
  kiapi.common.types.KIID id = 1;
  // A placed pin retains its own id and points to its definition pin here.
  // Absent on library-owned pins and legacy messages; never infer this link
  // from a pin number, position, or display name.
  kiapi.common.types.KIID library_pin_id = 15;

  string name = 2;
  string number = 3;

  kiapi.common.types.Vector2 position = 4;
  kiapi.common.types.Distance length = 5;
  SchematicPinOrientation orientation = 6;

  kiapi.common.types.ElectricalPinType electrical_type = 7;
  SchematicPinShape shape = 8;
  bool visible = 9;

  kiapi.common.types.Distance name_text_size = 10;
  kiapi.common.types.Distance number_text_size = 11;

  repeated SchematicPinAlternate alternates = 12;
  optional string active_alternate = 13;

  repeated kiapi.common.types.CustomProperty custom_properties = 14;
}

message SchematicSymbolUnit
{
  int32 unit = 1;
}

message SchematicSymbolBodyStyle
{
  int32 style = 1;
}

// A schematic item that is stored in a symbol definition
message SchematicSymbolChild
{
  google.protobuf.Any item = 1;

  // if absent, item is common to all units
  optional SchematicSymbolUnit unit = 2;

  // if absent, item is common to all body styles
  optional SchematicSymbolBodyStyle body_style = 3;

  // Private items are only shown in the symbol editor, not the schematic
  bool is_private = 4;
}

message SchematicSymbolAttributes
{
  bool exclude_from_simulation = 1;
  bool exclude_from_bill_of_materials = 2;
  bool exclude_from_board = 3;
  bool exclude_from_position_files = 4;
  bool do_not_populate = 5;
}

// What one design variant changes about a placed symbol.
message SchematicSymbolVariant
{
  string name = 1;

  // override description for this variant
  optional string description = 2;

  // complete set of attributes for a symbol with this variant
  SchematicSymbolAttributes attributes = 3;

  // The fields this variant overrides, keyed by field name.  Fields left out resolve to the
  // symbol's own value.
  map<string, string> fields = 4;

  // Optional on updates: absent preserves the existing override; a present
  // empty identifier clears it. Snapshots include a present empty identifier
  // when there is no substitution, so replay cannot retain stale data.
  kiapi.common.types.LibraryIdentifier symbol_override = 5;

  // Optional on updates: absent preserves the existing pin mapping. Snapshots
  // always include this record, including the library-default mode.
  PinMapInstanceOverride pin_map_override = 6;
}

// All variants for a symbol
message SchematicSymbolVariants
{
  repeated SchematicSymbolVariant variants = 1;
}

// What one design variant changes about a placed sheet.
message SheetVariant
{
  string name = 1;

  // The variant's description override
  optional string description = 2;

  // The attributes in effect for this variant.
  optional bool exclude_from_sim = 3;
  optional bool exclude_from_bom = 4;
  optional bool dnp = 5;

  // The fields this variant overrides, keyed by field name.
  map<string, string> fields = 6;
}

// The complete set of variants carried by one instance of a sheet.  Update semantics match
// SchematicSymbolVariants.
message SheetVariants
{
  repeated SheetVariant variants = 1;
}

message PinMapEntry
{
  string pin_number = 1;
  string pad_number = 2;   // bracketed stacked list allowed, e.g. "[4,9]"
}

// A named, footprint-agnostic pin map.
message PinMap
{
  string name                  = 1;
  repeated PinMapEntry entries = 2;
}

// A footprint choice on a symbol, tied to a named pin map.
message AssociatedFootprint
{
  kiapi.common.types.LibraryIdentifier footprint = 1;
  string map_name = 2;
}

// The pin-map bundle owned by a library symbol.
message SymbolPinMaps
{
  repeated AssociatedFootprint associated_footprints = 1;
  repeated PinMap pin_maps                           = 2;
}

enum PinMapOverrideMode
{
  PMOM_UNKNOWN             = 0;
  PMOM_USE_LIBRARY_DEFAULT = 1;
  PMOM_USE_NAMED_MAP       = 2;
  PMOM_FORCE_IDENTITY      = 3;
  PMOM_DELEGATE_TO_UNIT_1  = 4;
}

// A per-instance override of the active pin map
message PinMapInstanceOverride
{
  PinMapOverrideMode mode      = 1;
  string active_map_name       = 2;
  repeated PinMapEntry edits   = 3;
}

enum SchematicPassthroughMode
{
  SPM_UNKNOWN = 0;
  SPM_DEFAULT = 1;
  SPM_BLOCK   = 2;
  SPM_FORCE   = 3;
}

// A group of pin numbers that should be treated as internally connected
message JumperGroup
{
  repeated string pin_numbers = 1;
}

message JumperSettings
{
  /// If true, duplicate pin numbers in this symbol are jumpered together
  bool duplicate_names_are_jumpered = 1;

  repeated JumperGroup groups = 2;
}

message SchematicUnitDisplayName
{
  int32  unit = 1;
  string name = 2;
}

message SchematicBodyStyle
{
  string name = 1;
}

message SchematicSymbol
{
  kiapi.common.types.LibraryIdentifier id = 1;

  SchematicSymbolType type = 2;
  SchematicSymbolAttributes attributes = 3;

  SchematicField reference_field = 4;
  SchematicField value_field = 5;
  SchematicField footprint_field = 6;
  SchematicField datasheet_field = 7;
  SchematicField description_field = 8;

  // The pins, graphics, text, fields, etc that form the library definition of the symbol
  repeated SchematicSymbolChild items = 9;

  uint32 unit_count = 10;
  repeated SchematicBodyStyle body_style = 11;

  string keywords = 12;
  repeated string footprint_filters = 13;

  SymbolPinMaps pin_maps = 14;

  JumperSettings jumpers = 15;

  bool units_locked = 16;
  repeated SchematicUnitDisplayName unit_display_names = 17;
  bool embedded_fonts = 18;

  // Definition pins use symbol-local coordinates when true. Legacy instance
  // messages used sheet-space pin positions; false preserves that input form.
  // Local coordinates let position/transform edits preserve pin geometry.
  bool pins_use_local_coordinates = 19;

  // Files owned by this library definition, not the schematic document.
  // Present and empty explicitly clears them; native snapshots always include it.
  kiapi.common.types.EmbeddedFiles embedded_files = 20;
  // Native De Morgan semantics are distinct from custom styles with the same
  // display names. True requires the Standard/Alternate pair, in that order.
  bool demorgan_body_styles = 21;
}

message SchematicSymbolTransform
{
  SchematicSymbolOrientation orientation = 1;
  bool mirror_x = 2;
  bool mirror_y = 3;
}

// A native schematic cache owns self-contained library definitions, including
// definitions with no placed instance. External-library inheritance is not a
// schematic cache feature. cache_key is the exact native lib_symbols map key.
message SchematicCachedSymbol
{
  string cache_key = 1;
  SchematicSymbol definition = 2;
  bool show_pin_names = 3;
  bool show_pin_numbers = 4;
  kiapi.common.types.Distance pin_name_offset = 5;
}

// Persisted placements of one shared symbol, including placements belonging to
// other projects that share its schematic file. Paths are exact native UUID
// sequences, not the currently displayed/human-readable sheet path.
message SymbolSheetRecord
{
  repeated kiapi.common.types.KIID path = 1;
  string project_name = 2;
  string reference = 3;
  int32 unit = 4;
  // Complete local variant records; global variant descriptions are not owned
  // by these records and must be captured with schematic project settings.
  SchematicSymbolVariants variants = 5;
}

message SymbolSheetRecords
{
  repeated SymbolSheetRecord records = 1;
}

// An instance of a symbol placed on a schematic sheet.
message SchematicSymbolInstance
{
  kiapi.common.types.KIID id = 1;

  // Symbol instances may refer to the same graphical symbol from multiple different sheets
  // in a hierarchical schematic.  Each instance will have its own reference designator, and
  // may also have a different selected unit and other attributes.
  //
  // On a create or update request the targeted sheet comes from the request header, and this
  // field reports the sheet the returned instance was read from.
  kiapi.common.types.SheetPath path = 2;

  kiapi.common.types.Vector2 position = 3;
  SchematicSymbolTransform transform = 4;
  kiapi.common.types.LockedState locked = 5;

  SchematicSymbol definition = 6;

  SchematicField reference_field = 7;
  SchematicField value_field = 8;
  SchematicField footprint_field = 9;
  SchematicField datasheet_field = 10;
  SchematicField description_field = 11;

  // The attributes of the default variant, shared by every instance of this symbol.  Give one
  // instance its own attributes through a named variant instead.
  SchematicSymbolAttributes attributes = 12;

  SchematicSymbolUnit unit = 13;
  optional SchematicSymbolBodyStyle body_style = 14;
  bool show_pin_names = 15;
  bool show_pin_numbers = 16;
  kiapi.common.types.Distance pin_name_offset = 17;

  reserved 18;   // repeated SchematicSymbolVariant, superseded by the SchematicSymbolVariants set

  repeated SchematicField user_fields = 19;
  PinMapInstanceOverride pin_map_override = 20;
  bool fields_autoplaced = 21;

  // Screen cache alias; empty means use library_id, or definition.id in legacy messages.
  string lib_name = 22;

  SchematicPassthroughMode passthrough = 23;

  repeated kiapi.common.types.CustomProperty custom_properties = 24;

  // The variants carried by this instance.
  SchematicSymbolVariants variants = 25;

  // A snapshot includes all persisted placements, not only `path`. On update,
  // absence preserves existing placements; presence replaces the complete set.
  // The targeted placement's reference/unit/variants above are then applied.
  SymbolSheetRecords instance_records = 26;
  // In this form, a pin without library_pin_id is an owned definition pin
  // with no persisted placement identity (for example an inactive body style).
  // Activating it allocates a new placement UUID. False preserves legacy input.
  bool separate_pin_identities = 27;
  // Original library link owned by the placement. The cached definition can
  // carry a different id after local edits. Legacy absence means definition.id.
  kiapi.common.types.LibraryIdentifier library_id = 28;
  // Owned LIB_SYMBOL spacing, independent of the placement's SYMBOL base
  // offset above. Legacy absence retains the decoder's library default.
  kiapi.common.types.Distance definition_pin_name_offset = 29;
}

message SheetInstance
{
  kiapi.common.types.SheetPath path = 1;
  string name = 2;
  string filename = 3;
  string page_number = 4;

  repeated SheetInstance children = 5;
}

message SchematicNetSheetContents
{
  kiapi.common.types.SheetPath path = 1;

  repeated kiapi.common.types.KIID items = 2;
}

message SchematicNet
{
  string name = 1;

  repeated SchematicNetSheetContents sheets = 2;
}

message SchematicTableCell
{
  SchematicTextBox text_box = 1;
  int32 column_span = 2;
  int32 row_span = 3;

  repeated kiapi.common.types.CustomProperty custom_properties = 4;
}

enum TableStrokeMode
{
  TSM_UNKNOWN = 0;
  TSM_DISABLED = 1;
  TSM_ENABLED = 2;
}

message SchematicTable
{
  kiapi.common.types.KIID id = 1;

  int32 column_count = 2;
  repeated kiapi.common.types.Distance column_widths = 3;
  repeated kiapi.common.types.Distance row_heights = 4;

  kiapi.common.types.LockedState locked = 5;

  repeated SchematicTableCell cells = 6;

  TableStrokeMode external_border = 7;
  TableStrokeMode header_separator = 8;
  kiapi.common.types.StrokeAttributes border_stroke = 9;

  TableStrokeMode row_separators = 10;
  TableStrokeMode column_separators = 11;
  kiapi.common.types.StrokeAttributes separators_stroke = 12;

  repeated kiapi.common.types.CustomProperty custom_properties = 13;
}
