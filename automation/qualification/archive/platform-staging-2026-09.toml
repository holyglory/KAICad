# Historical one-shot staging and publication recipes for specific September 2026 Windows and
# platform-feed candidates (sequences 1-13 era), archived 2026-09-26 to keep the root declaration
# under its 256 KiB limit. Outputs and receipts are immutable. Not loaded by DevCoordinator;
# current check families stay in the root declaration.

[test.windows-requalified-stage]
timeout_seconds=1200
env={ TMPDIR = "/mnt/build-storage/codex/kicad/t" }

[[test.windows-requalified-stage.check]]
name="build"
tier="development"
role="preflight"
invalidates=["contracts", "stage"]
command=["dotnet", "build", "automation/KiCad.Automation.slnx", "--configuration", "Debug", "--no-restore"]

[[test.windows-requalified-stage.check]]
name="contracts"
tier="development"
role="preflight"
invalidates=["stage"]
command=["dotnet", "test", "automation/KiCad.Automation.slnx", "--configuration", "Debug", "--no-build", "--no-restore", "--filter", "FullyQualifiedName~WindowsRequalifiedPreviewTests|FullyQualifiedName~HostedPreviewStagingTests", "--logger", "trx;LogFileName=results.trx", "--results-directory", "automation/artifacts/windows-requalified-tests"]
retained_artifacts=[{ name = "windows-requalified-tests", path = "automation/artifacts/windows-requalified-tests", max_bytes = 16777216 }]

[[test.windows-requalified-stage.check]]
name="stage"
tier="development"
command=["dotnet", "automation/tools/KiCad.Automation.Validation/bin/Debug/net10.0/kicad-validate.dll", "stage-requalified-windows", "--candidate", "/mnt/build-storage/codex/kicad/evidence/github-34555975985-windows-corrected-candidate/kicad-delivery", "--qualification", "/mnt/build-storage/codex/kicad/evidence/github-34571626328-windows-retained-passed/native-windows-x64-c9319056c3392875aca22ec78e27e09b05597037-1/kicad-windows-preflight", "--repository", "/mnt/build-storage/codex/kicad/worktrees/windows-source-433.iTweC0", "--commit", "433c5e1fdf5954955a19df546236dce78e78b5b0", "--run-id", "34571626328", "--version", "preview-20260911-433c5e1fdf59", "--previous", "/mnt/build-storage/codex/kicad/public-candidates/signed-preview-000013", "--output", "/mnt/build-storage/codex/kicad/public-candidates/windows-433-requalified"]

# Requires the separately retained clean native baseline rerun. The compiled
# stager refuses failed/missing/mismatched evidence before admitting any bytes.
# Its signed sequence-1 envelope is a test/installation baseline, never a
# replacement for the current public Windows sequence-2 feed.
[test.windows-baseline-stage]
timeout_seconds=600
env={ TMPDIR = "/mnt/build-storage/codex/kicad/t" }

[[test.windows-baseline-stage.check]]
name="stage"
tier="development"
